[package]
name = "smear-parser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
readme = "README.md"
description = "Atomic parser-combinators for GraphQL and GraphQL-like DSLs"

[features]
default = ["std", "graphql", "graphqlx"]
alloc = ["smear-lexer/alloc"]
std = ["smear-lexer/std"]

unstable = ["smear-lexer/unstable"]

graphql = ["smear-lexer/graphql"]
graphqlx = ["unstable", "smear-lexer/graphqlx"]

bytes = ["dep:bytes", "smear-lexer/bytes", "tokora/bytes_1"]
bstr = ["smear-lexer/bstr", "tokora/bstr_1"]
hipstr = ["smear-lexer/hipstr", "tokora/hipstr_0_8"]
smallvec = ["dep:smallvec", "smear-lexer/smallvec"]

rowan = ["dep:rowan", "tokora/rowan", "std"]

# Instruments both dialects' lossless productions with a per-node-kind hit counter, so each
# trivia-injection gate can prove its corpus reached every production instead of asserting
# success over whichever handful of shapes it happens to exercise. The two dialects tally in
# separate lanes keyed by `KindSpace::NAME`, so one gate's reset cannot clear the other's
# measurement. Test-only: it changes no behaviour, and without it the instrumentation is not
# compiled at all.
lossless-coverage = ["rowan"]

# Compiles the lossless suites' `test_support` scaffolding: the substrate's kind-space
# conformance assertion, the two dialects' sink and trivia probes, and the 63 per-production
# `fn(&str) -> Parse` drivers `lossless_drivers!` generates. Every one of them is reachable only
# from an integration test in `tests/`, which is a separate crate and therefore sees `pub` and
# nothing else — so `#[cfg(test)]` and `pub(crate)` are both out of reach and a feature is the
# only door. Off, none of it is compiled and none of it is public API.
#
# Deliberately does NOT imply `rowan`. All of it lives inside the `rowan`-gated lossless tower,
# so with `rowan` off there is nothing for this feature to expose; implying it would drag the
# whole tower into `cargo test`'s default-feature row, which today compiles the lossless suites
# to nothing on purpose.
#
# `smear-parser`'s own tests get it from the self dev-dependency below, not from a
# `required-features` entry. See that block for why.
test-support = []

[dependencies]
derive_more.workspace = true
tokora.workspace = true
smear-lexer.workspace = true
paste = "1"

bytes = { workspace = true, optional = true }
smallvec = { version = "1", default-features = false, features = ["const_new"], optional = true }
rowan = { version = "0.16", optional = true }

[dev-dependencies]
# The crate depending on itself, so `test-support` is on for every dev target — tests, benches,
# examples, doctests — and off for every consumer.
#
# **Not `required-features`.** An unsatisfied `required-features` entry makes cargo *skip* the
# target: it compiles nothing, prints nothing, and the run is green. Thirty-three test targets
# gated that way would go silently empty the first time somebody ran `cargo test` without
# remembering the feature, and no exit code would say so. A dev-dependency inverts that — the
# feature is enabled by the manifest itself, so there is no invocation in which a test target
# both exists and cannot see the scaffolding, and nothing to forget.
#
# A dev-dependency cycle is explicitly allowed by cargo (dev-dependencies are not used to build
# the library itself), and resolver v2/v3 keeps dev-only features out of a plain `cargo build`.
# Path-only and version-less on purpose: cargo drops such a dependency when packaging, so the
# published manifest does not name a version of itself.
smear-parser = { path = ".", features = ["test-support"] }

criterion = "0.8"
apollo-parser = "0.8.6"
graphql-parser = "0.4.1"
async-graphql-parser = "7.2.1"
cynic-parser = "=0.11.2"

[[bench]]
name = "executables"
path = "benches/executables.rs"
harness = false
required-features = ["graphql"]

[[bench]]
name = "type_system"
path = "benches/type_system.rs"
harness = false
required-features = ["graphql"]

[[bench]]
name = "graphqlx"
path = "benches/graphqlx.rs"
harness = false
required-features = ["graphqlx"]

# See `smear/Cargo.toml` for why this block exists at all (#65). This is the crate where
# `all-features` was genuinely in question, so the decision is recorded rather than assumed.
#
# The two dialects are not the tension they look like. `graphql` and `graphqlx` are BOTH in
# `default`, so a page carrying both is the surface a reader gets from `cargo add smear-parser`,
# not an exotic union nobody compiles. `rowan` has to be on for an unrelated reason: it gates the
# whole lossless CST tower, a headline consumer feature that would otherwise be absent from the
# page entirely.
#
# `test-support` is the entry that looks wrong and is not. Leaving it out would stop
# `lossless::test_support` being compiled, and that module is documented ON PURPOSE — its own
# header argues the case, `KindSpace` being a public unsealed extension point whose invariants are
# stated in prose and enforced nowhere else — and it carries
# `#[cfg_attr(docsrs, doc(cfg(feature = "test-support")))]`, a badge that renders only in a build
# that enables the feature. Excluding it here would leave that attribute inert on docs.rs, which
# is #65's own defect reproduced one level down inside its fix. It does not drag the 68
# per-production drivers onto the page either: every `test_support` under a *dialect* is
# `#[doc(hidden)]`, so the feature adds exactly one documented item.
#
# `lossless-coverage` is the one awkward inclusion — it exports six instrumentation items nobody
# ships. The answer to that is the `doc(cfg)` badge now on them in `src/lossless/coverage.rs`,
# NOT a hand-written `features = [...]`. A literal list documents the features somebody
# remembered on the day they wrote it, and the next feature added to this manifest would be
# missing from docs.rs with nothing anywhere reporting it — the same silence as #65, one release
# later. Keeping `all-features` also keeps the CI leg and the published build the same command,
# so the gate tests the configuration docs.rs actually runs.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
