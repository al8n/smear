[package]
name = "smear-semantics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
description = "The algorithms smear's GraphQL schema builder and GraphQLx analyzer share: a byte-spelling interner, duplicate-name detection and a graph-cycle kernel."
keywords = ["graphql", "interner", "scc", "no-std"]
categories = ["algorithms", "no-std"]
readme = "README.md"

[features]
default = ["std"]

# The three kernels allocate, so with neither `std` nor `alloc` this crate is empty. Either tier
# compiles them, and `std` also flips the crate attribute.
alloc = []
std = []

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
