# What a consumer builds, so that the consumer's experience is the thing under test.
#
# The property here is not "does a feature deliver its capability" — that one a workspace test can
# reach. It is "can a SECOND DEPENDENCY in the graph reach a capability the consumer never enabled",
# and nothing inside smear's workspace can observe it: cargo unifies a package's features across the
# graph, and smear's own workspace has no second requester. It needs a downstream, so this is one.
#
# Ported from `pql/ci/downstream.sh` and `pql/ci/downstream/`, which exist because pql hit the
# sibling of this problem. Six review rounds there converged on one shape and one lesson — *a check
# that establishes its conclusion relative to a frame it never establishes* — and the shape is what
# is copied: composed flags, a committed lock read with `--locked`, POS legs that must compile, NEG
# legs that must fail ON A NAMED REASON, and no dev-dependencies.
#
# ## Why it is its own workspace root and not a member of smear's
#
# A member with a dependency edge to `smear` would add its features to the workspace-wide resolve,
# so a `--workspace` command would unify them into smear's own build — which is exactly the
# unification this crate exists to escape. `[workspace]` below makes it a separate root, and the
# root manifest's `exclude` says so a second time, so a future `members` glob cannot swallow it.
#
# ## Why it has no dev-dependencies, and must never acquire any
#
# `cargo metadata`'s resolve includes dev-dependencies and `cargo build`'s does not, so one
# dev-dependency here would split the planner's model of the graph from the graph the legs build.
# `ci/downstream_pairs.py` C3 rejects any dependency whose kind is `dev` or `build`.
[package]
name = "smear-downstream"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

# ## One `uses-<pair>` per OBSERVABLE gated path, and no `case-` aliases
#
# `uses-<pair>` compiles code that names one path smear's feature claims to gate, and forwards
# NOTHING. `ci/downstream.sh` builds each one three times, composing every flag on the command line
# so the legs differ in exactly one thing:
#
#   CTL    --features uses-<pair>,smear/std[,…]                      must FAIL, on an unresolved path
#   POS    --features uses-<pair>,smear/std[,…],smear/<f>            must COMPILE
#   LEAK   --features uses-<pair>,smear/std[,…],<member>/<f>         must FAIL, on the equivalence
#
# CTL is what stops POS being vacuous: a `uses-` module that stopped naming the path would make CTL
# compile, which is a hard red. LEAK is the finding — before the equivalence assertion landed, every
# one of these ten COMPILED.
#
# Composed rather than aliased, which is pql's R5: an alias that loses its `uses-` half builds no
# code at all and passes forever.
[features]
default = []

uses-lexer-graphql = []
uses-lexer-graphqlx = []
uses-lexer-bytes = ["dep:bytes"]
uses-parser-graphql = []
uses-parser-graphqlx = []
uses-parser-rowan = []
uses-parser-test-support = []
uses-schema-introspection = []
uses-compiler-rowan = []
uses-compiler-introspection = []

[dependencies]
# By path, and with NO features at all. Every capability a leg needs is composed on the command
# line, so nothing is an ambient input that no leg names and the planner cannot see — pql's R6.
smear = { path = "../../smear", default-features = false }

# The second requester, one optional entry per member. A leg turns one on with
# `--features <member>/<f>`, which activates the optional dependency and its feature in one flag —
# so even the second dependency's existence is composed rather than declared.
#
# THE POINT OF THIS BLOCK: these are the packages a consumer might legitimately name directly (a
# syntax highlighter takes `smear-lexer`; a driver that only reads a schema takes `smear-schema`),
# and before the equivalence assertion each of them could switch a `smear::…` path on behind a
# consumer's back.
smear-lexer = { path = "../../smear-lexer", default-features = false, optional = true }
smear-parser = { path = "../../smear-parser", default-features = false, optional = true }
smear-schema = { path = "../../smear-schema", default-features = false, optional = true }
smear-compiler = { path = "../../smear-compiler", default-features = false, optional = true }
graphql-proto = { path = "../../graphql-proto", default-features = false, optional = true }

# The consumer's own copy of a source crate, for the one probe whose capability is a trait impl
# rather than a path. It carries no smear feature, which is the same omission pql's `tokora` entry
# is written around.
bytes = { version = "1", optional = true }
