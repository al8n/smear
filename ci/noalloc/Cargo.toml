# The core-tier proof: `smear` with every capability and no tier feature, as a `staticlib` with no
# `#[global_allocator]`; rustc refuses that if anything in the graph links `alloc`. Not a workspace
# member, like `ci/downstream/`: its empty `[workspace]` keeps other members' features out of it.
[package]
name = "smear-noalloc"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["staticlib"]

[features]
default = []
# The control: with `smear/alloc` the build must FAIL on the missing allocator (`ci/noalloc.sh`).
alloc = ["smear/alloc"]

# Every `smear` feature, `default` aside, whose closure holds neither `alloc` nor `std` nor a
# feature whose dependency links a tier whatever smear asks for (`LINKS_A_TIER` in `ci/noalloc.sh`):
# no feature but a tier switches a tier on, but `bytes_1`, `hipstr_0_8`, `smol-bytes_0_2` and
# `rowan_0_17` bring a dependency that links one. `ci/noalloc.sh` fails unless this list is exactly
# that set.
[dependencies]
smear = { path = "../../smear", default-features = false, features = [
  "graphql",
  "graphqlx",
  "parser",
  "validator",
  "proto",
  "introspection",
  "analysis",
  "materialized-numbers",
  "test-support",
  "bstr",
  "bstr_1",
] }
