[package]
name = "smear"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
description = "The I/O-free core of a GraphQL implementation: zero-copy parsing to an AST or a lossless CST, and draft-specification validation, for GraphQL and GraphQLx."

# `smear/README.md` is a SYMLINK to the workspace-root `README.md`, and both halves of that
# matter. `src/lib.rs` opens with `#![doc = include_str!("../README.md")]`, and until #101 that
# path was `../../README.md` — above the package root, at a file cargo cannot put in the
# tarball. `cargo publish` packaged the whole crate and then failed the verification build with
# `couldn't read src/../../README.md: No such file or directory`, so this crate was not
# publishable at all and no job in this repository said so.
#
# Cargo materialises a symlink's TARGET into the `.crate` archive, so the published package
# carries a real 18KB README while the working tree keeps exactly one copy of it — the root file
# GitHub renders as the landing page. A duplicate would have worked too and would then need a
# byte-identity gate to stop the two drifting; a symlink has nothing to drift. It is also the
# sibling `tokora` repository's own solution to this, `tokora/README.md` being mode 120000 for
# the same reason.
#
# The one platform caveat, recorded because it is a degradation and not a failure: a Windows
# checkout without `core.symlinks` writes this path as a 12-byte text file containing
# `../README.md`, so a Windows build embeds that string as the crate docs. Nothing in this
# repository renders rustdoc on Windows — `docs` and `publish-dry-run` in `.github/workflows/ci.yml`
# are both `ubuntu-latest`, and docs.rs is Linux — so no published or gated artifact can see it.
# `publish-dry-run` additionally hashes the packaged README against the root file, so a checkout
# that produced the stub fails there rather than shipping twelve bytes to docs.rs.
readme = "README.md"

# One crate, two layers. `smear-lexer` and `smear-parser` were merged in here (#83): the facade
# they sat behind had to re-declare each of their features to forward it, and it silently did not
# forward `rowan` — the gate on the entire lossless CST tower — so the crate named `smear` could
# not reach the half of the project that tower is (#81). With one manifest there is no forwarding
# left to omit. Neither member had ever been published, so nothing on the registry moved.

[features]
default = ["std", "graphql", "graphqlx", "parser", "smallvec"]

# Element-for-element what the facade's default already resolved to: `std`, `smallvec`, both
# dialects, and the parser, which a `smear` dependency compiled unconditionally. A default build
# compiles the same code before and after the merge.

std = ["tokora/std", "thiserror/default", "bytes?/default", "bstr?/default", "hipstr?/default"]

graphql = []
# Tracks a moving dialect spec: the GraphQLx surface is semver-exempt until the dialect
# stabilises. This comment is the successor to the deleted `unstable` marker feature, which gated
# no code anywhere in the workspace and was auto-enabled by this one — cargo features are
# additive, so an implication cannot ask for consent, and no consumer ever typed `unstable` to get
# GraphQLx. `alloc` went the same way and for the same reason: nothing read
# `cfg(feature = "alloc")`, both layers unconditionally `extern crate alloc as std` when `std` is
# off, and there is no core-only tier for it to select.
graphqlx = []

# The parser tower (`smear::parser`). Off, this crate is the lexer alone — the configuration that
# used to be the `smear-lexer` crate, for the consumers it existed to serve: syntax highlighters,
# formatter front-ends, token-level tooling. Measured on a fresh crate-only compile over warm
# deps: lexer 3.4s, parser +12.7s at default features and +19.6s with `rowan`, so the gate saves
# a lexer-only consumer a 4-6x compile multiplier for code it never names.
#
# There is deliberately NO `lexer` feature to pair with it. The lexer is the irreducible base —
# the parser cannot exist without it and a build with both off is an empty crate — and a gate that
# can only ever be on is not a gate.
parser = []

# GraphQL document validation (`smear::validator`), including the built-once `Schema` and the
# draft §3 "Type Validation" pass that runs inside its build.
#
# Off by default until the API stabilises; it flips into `default` alongside a minor bump. It
# implies `parser` because the builder consumes a parsed `TypeSystemDocument`, and `graphql`
# because the specification it implements is standard GraphQL's — GraphQLx deliberately has no
# validator.
#
# It adds NO dependency. The schema representation is `core` + `alloc` and nothing else, which the
# `smear-noatomic` workspace member holds to by compiling those very files for
# `thumbv6m-none-eabi` with an empty `[dependencies]` table.
validator = ["parser", "graphql"]

# The second construction door: building a `Schema` out of a draft §4 introspection response
# instead of out of SDL (`Schema::from_introspection`).
#
# THIS IS NOT WHAT PUTS INTROSPECTION IN A SCHEMA. The `__`-prefixed meta-schema is injected by
# every build, feature or no feature, because an introspection *query* is an executable document
# that draft 5.3.1 asks about like any other. This feature is only about where a schema comes
# *from*, and `smear/src/validator/schema/builtin.rs` carries that distinction at the other end.
#
# It is the one validator feature that costs a dependency, which is exactly why it is a feature.
# `serde` and `serde_json` are the workspace's first — nothing else in the tree names either — so
# a consumer who builds schemas from SDL never resolves them, and neither does `smear-noatomic`,
# whose empty `[dependencies]` table CI asserts.
#
# `std` is not decoration. `serde_json`'s `alloc`-only mode exists, but the door parses a
# `&str` from a network response and reports through `std::error::Error`, and the whole point of
# the no-atomic tier is the *representation*, which this feature does not touch.
introspection = ["validator", "std", "dep:serde", "dep:serde_json"]

smallvec = ["dep:smallvec"]
bytes = ["dep:bytes", "tokora/bytes_1"]
bstr = ["dep:bstr", "tokora/bstr_1"]
hipstr = ["dep:hipstr", "tokora/hipstr_0_8"]
smol-bytes = ["dep:smol-bytes", "tokora/smol_bytes_0_1"]

# The lossless CST tower. Reachable through the crate named `smear` for the first time here (#81).
# `parser` because the tower lives in that module; `std` because the runner needs it.
#
# EVERYTHING THIS FEATURE COMPILES IS OUTSIDE MIRI'S REACH, and will stay outside it until
# `rowan` is fixed upstream. `rowan 0.17.0` executes undefined behaviour on the ordinary path —
# `src/arc.rs` under Stacked Borrows, from building any green tree, and `src/cursor.rs` under
# Tree Borrows, from dropping any red one. Both are live in every published version through
# `0.17.0`, both were reproduced against rowan alone with no smear code involved, and there is
# no version to move to. #77 has the evidence; `ci/miri_sb.sh` has the decision; and
# `ci/miri_scope.py` will fail the Miri matrix if this feature ever resolves ON inside it, so
# turning it on there is not something that can happen by accident again.
#
# This says nothing against the feature — it is a headline capability and its 33 integration
# targets run under `cargo test` like everything else. It is only that ONE tool cannot see it.
rowan = ["dep:rowan", "tokora/rowan", "std", "parser"]

# Instruments both dialects' lossless productions with a per-node-kind hit counter, so each
# trivia-injection gate can prove its corpus reached every production instead of asserting
# success over whichever handful of shapes it happens to exercise. The two dialects tally in
# separate lanes keyed by `KindSpace::NAME`, so one gate's reset cannot clear the other's
# measurement. Test-only: it changes no behaviour, and without it the instrumentation is not
# compiled at all.
lossless-coverage = ["rowan"]

# Compiles the lossless suites' `test_support` scaffolding: the substrate's kind-space
# conformance assertion, the two dialects' sink and trivia probes, and the per-production
# `fn(&str) -> Parse` drivers `lossless_drivers!` generates. Every one of them is reachable only
# from an integration test in `tests/`, which is a separate crate and therefore sees `pub` and
# nothing else — so `#[cfg(test)]` and `pub(crate)` are both out of reach and a feature is the
# only door. Off, none of it is compiled and none of it is public API.
#
# Deliberately does NOT imply `rowan` (nor, therefore, `parser`). All of it lives inside the
# `rowan`-gated lossless tower, so with `rowan` off there is nothing for this feature to expose;
# implying it would drag the whole tower into `cargo test`'s default-feature row, which today
# compiles the lossless suites to nothing on purpose.
#
# The merge widened its scope in one benign way, recorded here because it is not obvious: the self
# dev-dependency below turns it on for EVERY dev target, which now includes the lexer's tests,
# benches and examples. They do not reference the scaffolding and the gated modules are
# parser-internal, so the feature being on is inert for them — as it is for any target with
# `rowan` off. The suites' own tests get it from that dev-dependency, not from a
# `required-features` entry; see that block for why.
test-support = []

[dependencies]
derive_more.workspace = true
paste = "1"
thiserror.workspace = true
tokora.workspace = true

memspan = { version = "0.1", default-features = false, features = ["std"] }

hipstr = { version = "0.8", default-features = false, optional = true }
bytes = { workspace = true, optional = true }
smol-bytes = { workspace = true, optional = true }
bstr = { workspace = true, optional = true }
smallvec = { version = "1", default-features = false, features = ["const_new"], optional = true }
rowan = { version = "0.17", optional = true }

# The `introspection` feature's two, and the only two dependencies in this manifest that are not
# either a source backing or part of the parser tower. `derive` because the draft §4 shape is a
# dozen plain records and hand-written visitors would be a dozen ways to get "missing field"
# wrong; `default-features = false` plus `std` on both because that is what the feature declares
# and an implicit default is how a no_std claim rots.
serde = { version = "1", default-features = false, features = ["std", "derive"], optional = true }
serde_json = { version = "1", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
# The crate depending on itself, so `test-support` is on for every dev target — tests, benches,
# examples, doctests — and off for every consumer.
#
# **Not `required-features`.** An unsatisfied `required-features` entry makes cargo *skip* the
# target: it compiles nothing, prints nothing, and the run is green. Thirty-three test targets
# gated that way would go silently empty the first time somebody ran `cargo test` without
# remembering the feature, and no exit code would say so. A dev-dependency inverts that — the
# feature is enabled by the manifest itself, so there is no invocation in which a test target
# both exists and cannot see the scaffolding, and nothing to forget.
#
# A dev-dependency cycle is explicitly allowed by cargo (dev-dependencies are not used to build
# the library itself), and resolver v2/v3 keeps dev-only features out of a plain `cargo build`.
# Path-only and version-less on purpose: cargo drops such a dependency when packaging, so the
# published manifest does not name a version of itself.
smear = { path = ".", features = ["test-support"] }

# The projection gate builds a synthetic green tree by hand — a tree whose *text* re-parses to a
# different structure — so that a "projection" which secretly re-parsed the source could not pass
# it. That needs rowan's builder, which the library re-exports no door to.
#
# Named DIRECTLY, which is the difference from the transitive edge #87 retired below: this one is
# chosen, visible in this manifest, and carries the same version requirement as the optional
# dependency above, so the two cannot resolve to different rowans. It is still the crate whose
# undefined behaviour is #77 — which is survivable here only because `ci/miri_sb.sh` and
# `ci/miri_tb.sh` run `-p smear --lib`, and no lib unit test reaches this dependency.
rowan = "0.17"
# `tokora::conformance` is the lexer-contract test kit; it is test-only, so the
# feature is pulled in here rather than in the normal dependency.
tokora = { workspace = true, features = ["conformance"] }

# ── WHAT IS DELIBERATELY NOT HERE ───────────────────────────────────────────────────────────
#
# `criterion`, and with it `apollo-parser`, `graphql-parser`, `async-graphql-parser` and
# `cynic-parser`. All five were dev-dependencies of this package and all five were reached from
# `benches/` and from nowhere else — no test, example or source file named one. They moved to
# the `smear-benches` member along with the four `[[bench]]` sections that used them; that
# manifest's header carries the reasoning in full.
#
# The short version, because putting any of them back has a cost that is not local. Cargo
# resolves dev-dependencies per PACKAGE, not per target, so every entry in this block is built
# for every test target of this package:
#
#   * `criterion` pulls `alloca`, whose build script compiles C through cc-rs. A Linux `cc`
#     rejects the `-arch arm64` / `-mmacosx-version-min` that cc-rs hands it for an apple
#     target, so this one edge is what forced four Miri cells onto a `macos-latest` runner —
#     for a reason that has nothing to do with Miri.
#   * `apollo-parser` pulls `rowan`, and with this package's own `rowan` feature off that edge
#     used to be the ONLY thing putting rowan in the graph at all. rowan is the crate whose
#     undefined behaviour is #77. That sentence held until #58's projection gate, which names
#     `rowan` directly above — the point of the rule was never "no rowan", it was "no rowan
#     nobody asked for", and a direct entry with a reason beside it is the asked-for kind.
#
# A dev-dependency added here that drags either one back re-creates both conditions, and does it
# silently — nothing in CI reports on the shape of this block.
#
# `[lib] bench = false` stays. This package declares no `[[bench]]` target any more, so nothing
# here goes through criterion — but the setting is about the LIB, and without it cargo still
# builds a libtest bench harness for `src/lib.rs`.
[lib]
bench = false

# Both examples read files from argv and print to stdout, and they drive the
# GraphQL lossless lexer, so they need `std` and `graphql`.
[[example]]
name = "trivia_spans"
path = "examples/trivia_spans.rs"
required-features = ["std", "graphql"]

[[example]]
name = "token_mix"
path = "examples/token_mix.rs"
required-features = ["std", "graphql"]

[lints]
workspace = true

# Without this block docs.rs does not pass `--cfg docsrs`, so every
# `#[cfg_attr(docsrs, doc(cfg(...)))]` in the crate expands to nothing — on docs.rs ITSELF, not
# merely in CI. That was the state until #65: the attributes were written correctly and the badges
# they exist to render had never once appeared. `rustdoc-args` is the half that makes them expand;
# `all-features` is the half that decides the surface they are expanded over.
#
# `all-features = true`, and every entry it pulls in earns its place. The two dialects are both in
# `default`, so a page carrying both is the surface a reader gets from `cargo add smear`, not an
# exotic union nobody compiles — and they are where the `doc(cfg)` attributes outside the parser
# live, so a build that leaves a dialect out does not compile the module its badge is attached to.
# `parser` and `rowan` gate the lossless CST tower, a headline consumer feature that would
# otherwise be absent from the page entirely.
#
# `test-support` is the entry that looks wrong and is not. Leaving it out would stop
# `parser::lossless::test_support` being compiled, and that module is documented ON PURPOSE — its
# own header argues the case, `KindSpace` being a public unsealed extension point whose invariants
# are stated in prose and enforced nowhere else — and it carries
# `#[cfg_attr(docsrs, doc(cfg(feature = "test-support")))]`, a badge that renders only in a build
# that enables the feature. Excluding it here would leave that attribute inert on docs.rs, which
# is #65's own defect reproduced one level down inside its fix. It does not drag the
# per-production drivers onto the page either: every `test_support` under a *dialect* is
# `#[doc(hidden)]`, so the feature adds exactly one documented item.
#
# `lossless-coverage` is the one awkward inclusion — it exports six instrumentation items nobody
# ships. The answer to that is the `doc(cfg)` badge on them in `src/parser/lossless/coverage.rs`,
# NOT a hand-written `features = [...]`. A literal list documents the features somebody remembered
# on the day they wrote it, and the next feature added to this manifest would be missing from
# docs.rs with nothing anywhere reporting it — the same silence as #65, one release later. Keeping
# `all-features` also keeps the CI leg and the published build the same command, so the gate tests
# the configuration docs.rs actually runs.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
