[package]
name = "smear"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
description = "Blazing fast, fully spec-compliant, reusable parser combinators for standard GraphQL and GraphQL-like DSLs."

[features]
default = ["std", "smallvec", "graphql", "graphqlx"]
alloc = ["smear-lexer/alloc", "smear-parser/alloc"]
# Deliberately does NOT name `tokora/std`. `std` reaches tokora through
# `smear-lexer/std -> tokora/std`; naming it here would enable tokora's `std`
# unconditionally and silently make the no-std tier untestable.
std = ["smear-lexer/std", "smear-parser/std"]

unstable = ["smear-lexer/unstable", "smear-parser/unstable"]

graphql = ["smear-lexer/graphql", "smear-parser/graphql"]
graphqlx = ["unstable", "smear-lexer/graphqlx", "smear-parser/graphqlx"]

bytes = ["smear-lexer/bytes", "smear-parser/bytes"]
bstr = ["smear-lexer/bstr", "smear-parser/bstr"]
hipstr = ["smear-lexer/hipstr", "smear-parser/hipstr"]
smallvec = ["smear-lexer/smallvec", "smear-parser/smallvec"]

[dependencies]
tokora.workspace = true
smear-lexer.workspace = true
smear-parser.workspace = true
