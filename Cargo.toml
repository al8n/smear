[workspace]
members = [
  "ci/source_census",
  "graphql-proto",
  "smear",
  "smear-lexer",
  "smear-noatomic",
  "smear-parser",
  "smear-compiler",
  "smear-schema",
  "smear-smoke",
]

# ── ONE MEMBER PULLS `smear` PAST ITS DEFAULT FEATURE SET ────────────────────────────────────
#
# `smear-smoke` enables `smear/rowan`, `lossless-coverage` and `test-support`. Cargo unifies
# features across the SELECTED packages, so a bare workspace-wide command resolves `smear` with
# every feature it declares turned on.
#
# It used to be three of six. `benchmarks` (`smear-apollo-bench`) and `smear-benches` were the
# other two, and they are gone: their six criterion targets are now `smear`'s own, under
# `smear/benches/`, so a bare `cargo bench` reaches the whole suite and nothing crosses a member
# boundary to read a fixture. What that costs is in `smear/Cargo.toml`'s dev-dependency header —
# criterion and the comparison parsers are on this package's inner loop now — and it does not
# change this arithmetic, because a package's own dev-dependencies are not another member's
# feature request.
#
# THE SPLIT DID NOT CHANGE THIS ARITHMETIC, and it is worth saying why not: the five member crates
# below `smear` are reached only THROUGH it, so `smear-smoke`'s request travels down the same edges
# a dependent's does. What the split does change is that a bare workspace command now also selects
# those five directly, each at its own default — which is a wider build, not a wider resolve of
# `smear`.
#
# TWO members this arithmetic does not reach, both deliberately and for different reasons.
#
# `smear-noatomic`'s `[dependencies]` table is empty and CI asserts that out of `cargo metadata`,
# so it has no edge to `smear` to unify a feature through. It reaches the representation by
# `#[path]`-including those source files, which is what lets it build for a core with no
# compare-and-swap while `smear` itself cannot.
#
# `ci/source_census` depends on `syn` and on nothing in this workspace. It READS `smear`'s source
# as text — it is the #122 gate against a public entry narrowing its source type to `&str` — so
# it has no reason to link the crate, and an edge would put it in the resolve for no benefit. It
# is a member so that `cargo fmt --all`, `cargo clippy --workspace` and `cargo test --workspace`
# reach the gate itself; a gate that this repository's own gates do not check is a gate that
# rots.
#
# That arithmetic is how the entire lossless CST tower entered the Miri selection without anyone
# choosing it. #70 added `benchmarks`, #84 added `smear-smoke`, and each time the Miri scripts —
# which name no `-p` and no `--features` — got wider by resolution rather than by decision. The
# first time real lossless code reached Miri it reported undefined behaviour inside `rowan`
# (#77), which is the sharpest available statement of what an unchosen selection costs.
#
# There is deliberately NO `default-members` narrowing that away. It would pin the Miri
# selection at the price of silently narrowing every OTHER bare command in the repository:
# `cargo test --all-features` in `.github/workflows/ci.yml` is meant to cover every member
# and would quietly have stopped, with no exit code saying so — the same defect class, one turn
# later. The selection is pinned where it is READ instead: `ci/miri_sb.sh` and `ci/miri_tb.sh`
# pass `-p smear`, and `ci/miri_scope.py` fails the run if what got interpreted is not what
# those scripts claim.

# `ci/downstream/` is NOT a member and must never become one. It is a consumer fixture with a
# dependency edge to `smear`, so a member entry would add its features to the workspace-wide resolve
# and unify them into smear's own build — which is exactly the unification it exists to escape. It
# carries its own `[workspace]` table; this says the same thing a second time, so a future `members`
# glob cannot swallow it.
exclude = ["ci/downstream"]

resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
repository = "https://github.com/al8n/smear"
homepage = "https://github.com/al8n/smear"
license = "Apache-2.0 OR MIT"
rust-version = "1.95"

[workspace.dependencies]
bstr = { version = "1", default-features = false }
bytes = { version = "1", default-features = false }
smol-bytes = { version = "0.1", default-features = false }
derive_more = { version = "2", default-features = false, features = ["unwrap", "is_variant", "try_unwrap", "from", "into", "deref", "deref_mut", "as_ref", "display"] }
# `rowan` is in tokora's PUBLIC API: `Cst::checkpoint` returns `rowan::Checkpoint`, `Cst::finish`
# returns `rowan::GreenNode`, `cst::cast::token` returns `rowan::SyntaxToken`. So smear's `rowan`
# and tokora's `rowan` are not two independent choices — they are one choice made twice, and if
# they disagree on the major, cargo links both crates and the types stop matching. The failure is
# not subtle and it is not a deprecation: `expected rowan::GreenNode, found rowan::GreenNode`.
# `0.9` is therefore the floor, not a preference: published tokora 0.8.0 pins `rowan = "0.16"`,
# and 0.9.0 is the first release carrying `rowan = "0.17"` to match the pins in `smear` and
# `smear-smoke`. Because tokora is `0.x`, the minor IS the major — `^0.8.0` cannot reach 0.9.0 —
# so this requirement had to be edited rather than moved by `cargo update`.
#
# `combinators` is named explicitly and is NOT a rowan consequence. tokora 0.9.0 put each
# combinator family behind its own feature and made the `combinators` umbrella a DEFAULT feature;
# this workspace passes `default-features = false`, so without naming it the build loses the
# entire 0.8 combinator surface (`parens`, `then`, `then_ignore`, `repeated_while`,
# `Ident::parse`, `Keyword::parse_exact`, ...) — 166 errors when measured. Whether smear wants the
# umbrella or a narrower set of families is a compile-time-footprint question left open.
tokora = { version = "0.9", default-features = false, features = ["logos", "alloc", "unstable-raw", "combinators"] }

paste = "1"
thiserror = { version = "2", default-features = false }

graphql-proto = { path = "graphql-proto", version = "0.0.0", default-features = false }
smear = { path = "smear", version = "0.0.0", default-features = false }
smear-lexer = { path = "smear-lexer", version = "0.0.0", default-features = false }
smear-parser = { path = "smear-parser", version = "0.0.0", default-features = false }
smear-compiler = { path = "smear-compiler", version = "0.0.0", default-features = false }
smear-schema = { path = "smear-schema", version = "0.0.0", default-features = false }

[workspace.lints.rust]
rust_2018_idioms = "warn"
single_use_lifetimes = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
  # Testing / coverage helpers. These are set via `RUSTFLAGS='--cfg ...'`
  # in CI to force the dispatcher down a specific path so lower‑tier
  # kernels and the scalar fallback get coverage on runners that would
  # otherwise always pick the top tier.
  'cfg(smear_lexer_force_scalar)',
  'cfg(smear_lexer_disable_avx512)',
  'cfg(smear_lexer_disable_avx2)',
] }

