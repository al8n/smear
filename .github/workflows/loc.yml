name: loc 

on:
  push:
    # `main` is both the DEFAULT branch and the TRUNK; the separate trunk `feat/tokora-0.8` was
    # retired after `main` was fast-forwarded onto it. While they were different branches this lane
    # named only `main` and so never ran for a merge — this workflow uploads a line count to a gist
    # that went the trunk's entire life without one refresh (#74). Kept identical to `ci.yml`'s
    # list, whose comment carries the full reasoning and the note on why a literal name is
    # unavoidable in an `on:` block; `ci/check_workflow_triggers.sh` enforces the identity.
    #
    # The `paths-ignore` list below is deliberately NOT the one the other three carry. This
    # workflow counts lines of Rust, so markdown genuinely cannot change its result, whereas in
    # `ci.yml` a blanket `**.md` suppressed the one job that catches a broken README link. Only
    # the push-branch list is required to match.
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'COPYRIGHT'
      - 'LICENSE*'
      - '**.md'
      - '**.txt'
      - 'art'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'COPYRIGHT'
      - 'LICENSE*'
      - '**.md'
      - '**.txt'
      - 'art'
  workflow_dispatch:

# Every `run:` here is bash — the same block the other three workflows carry, and `ci.yml`'s
# has the full account. This is the weakest of the four instances: one ubuntu job, and its
# three `run:` blocks are plain command sequences that any shell would take. It is stated
# anyway so that "every workflow in this repository declares bash" is a property somebody can
# check by reading the four files, rather than a rule with one silent exception in the file
# nobody looks at. This repository has twice shipped a workflow fix into `ci.yml` and left the
# siblings behind.
defaults:
  run:
    shell: bash

jobs:
  loc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup update stable && rustup default stable
          rustup component add clippy
          rustup component add rustfmt
      
      - name: Install tokeit
        run: |
          cargo install tokeit --force
      
      - name: Count total lines of code
        run: |
          tokeit --lang rust
      - name: Upload total loc to GitHub Gist
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GIST_PAT }}
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('tokeit.json', 'utf8');
            const gistId = '327b2a8aef9003246e45c6e47fe63937';
            await github.rest.gists.update({
              gist_id: gistId,
              files: {
                "smear": {
                  content: output
                }
              }
            });
