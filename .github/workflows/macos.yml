name: macOS

# ── THE QUEUE-BOUND LANE ────────────────────────────────────────────────────────────────────
#
# These four legs used to be the `macos-latest` row of `CI`'s `rustfmt`, `clippy`, `build` and
# `test` matrices. They are here for the same reason the Miri matrices are in
# `.github/workflows/miri.yml`, and the two files' headers describe one measurement: on
# 2026-08-06 `CI` had not concluded on any of the last four pull requests, because the only jobs
# that never started were macOS-bound and a run's conclusion is a property of the WHOLE run. Two
# of those four merged with no CI verdict at all.
#
# The distinction between this file and `miri.yml` is queue versus clock. These four legs are
# FAST once they start and slow only because they wait: in run 30963710061 — the last `CI` run
# that concluded at all — `rustfmt (macos-latest)` waited 6h38m to run for 9 seconds,
# `clippy (macos-latest)` waited 6h08m to run 7m24s, `build (macos-latest)` waited 9h17m to run
# 6m05s, and `test (macos-latest)` waited 9h26m to run 18m12s. The Miri cells in that run were
# both queue-bound AND slow (4h20m of runtime for the longest). Same cause, different shape, and
# they are separated so that a macOS formatting failure and a Miri UB report can be read apart.
#
# This is a SCHEDULING change, not a coverage change. Every step below is what `CI` ran on
# `macos-latest` before, unchanged, and the job names are unchanged too — the single-entry `os`
# matrix is kept precisely so these still report as `rustfmt (macos-latest)` and friends. The one
# thing dropped is `test`'s `if: runner.os == 'Windows'` step, which can never fire here.
#
# Worth knowing when this lane's cost is next reviewed: `cargo fmt --all -- --check` is decided
# by the rustfmt version and `rustfmt.toml`, not by the host, so `rustfmt (macos-latest)` is the
# leg with the least to say — 9 seconds of work behind a 6h38m queue. It is kept because moving
# coverage and deleting it are different decisions, and it costs `CI` nothing from here.

# `push`/`pull_request` triggers and `paths-ignore` are deliberately identical to
# `.github/workflows/ci.yml` and `.github/workflows/miri.yml`; read the comment there for why the
# ignore list carries no blanket `**.md`. `schedule` is the one deliberate difference — see below.
# `ci/check_workflow_triggers.sh` enforces that the `on.push.branches` lists stay identical across
# every workflow that has one, because that is the part where a divergence is silent.
on:
  push:
    # `main` is both the DEFAULT branch and the TRUNK; the separate trunk `feat/tokora-0.8` was
    # retired after `main` was fast-forwarded onto it. While they were different branches this lane
    # named only `main` and so never ran for a merge (#74). Any further entry is a live integration
    # branch, which takes merges too and so needs a lane for the same reason: today that is
    # `feat/proto`, temporary, dropped when the `proto` campaign lands on `main`. Kept identical to
    # `ci.yml`'s list, whose comment carries the full reasoning, the order a retired entry has to be
    # removed in, and the note on why a literal name is unavoidable in an `on:` block.
    branches:
      - main
      - feat/proto
    paths-ignore:
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - 'docs/**.md'
      - '**.txt'
  pull_request:
    paths-ignore:
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - 'docs/**.md'
      - '**.txt'
  workflow_dispatch:
  # NO `schedule`, deliberately, and this is the one place these triggers differ from `CI`'s.
  #
  # It carried `[cron: "0 1 */7 * *"]` until #74, where it was pure decoration: a `schedule` runs
  # only the DEFAULT branch's copy of a workflow, and this file does not exist on `main` at all,
  # so the line had never fired once. Removing it costs nothing that was happening.
  #
  # It is not restored on the retarget that would make it fire, because these four legs are the
  # queue-bound ones — the header measures 6h38m to 9h26m of waiting for 9s to 18m of work, on a
  # macOS runner concurrency this repository does not own and shares. A weekly re-run of unchanged
  # code would spend that budget re-proving what the merge that produced the code already proved.
  # `push` and `pull_request` above cover every change; the cron would only cover the passage of
  # time, which is what `CI`'s cheap ubuntu/windows lane is for.

concurrency:
  # Identical to `CI`'s and `Miri`'s; see the comment in `miri.yml` for why `${{ github.workflow }}`
  # leads the group and why a push is keyed on the commit SHA.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

# Every `run:` here is bash — the same block `ci.yml` carries, for the same reason, and read
# that one for the full account. It is stated in this file even though nothing here runs on a
# Windows host, because the two `cargo hack` steps below are the SAME two steps that took
# `CI`'s `clippy (windows-latest)` and `build (windows-latest)` down in run 31085548219: they
# carry a `\` line continuation, which PowerShell does not have. They only work today because
# GitHub happens to pick bash for a macOS host. `test`'s `brew --prefix` step is the same bet
# with `$(...)` and `test -x ... || { ...; exit 1; }`.
#
# That bet is on the runner, not on the source, and this repository has already paid for
# fixing a defect only where it burned — see the sibling-drift note in
# `ci/check_workflow_triggers.sh`. The moment a `windows-latest` entry joins one of these
# single-entry `os` matrices, every one of those constructs is a ParserError. Stating the
# default costs three lines and takes the whole class off the table in advance.
defaults:
  run:
    shell: bash

# Carried from `CI` verbatim: these are the same jobs, and `RUSTFLAGS` is what they compiled
# with. `CI`'s `nightly` / `stable` entries are not carried — no step here, or there, reads them.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings -C debuginfo=0 -C codegen-units=16
  RUST_BACKTRACE: 1

jobs:
  # Check formatting
  rustfmt:
    name: rustfmt
    strategy:
      matrix:
        os:
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      run: rustup update stable --no-self-update && rustup default stable
    - name: Check formatting
      run: cargo fmt --all -- --check

  # Apply clippy lints
  clippy:
    name: clippy
    strategy:
      matrix:
        os:
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      run: rustup update stable --no-self-update && rustup default stable
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Apply clippy lints
      run: |
        cargo hack clippy --each-feature
        # Pass 2 — the pairwise isolation cells the crate split used to provide by accident.
        # `smear-parser`'s own `--each-feature` run was implicitly "parser x feature", because its
        # build always contained the parser; a single-crate `--each-feature` never builds `parser`
        # together with exactly one other feature. This restores those pairs deliberately, and the
        # two that matter are `parser` x `bytes` (60 parser cfg sites) and `parser` x dialect.
        #
        # `rowan`, `lossless-coverage`, `validator` and `introspection` are excluded because they
        # already imply `parser`, so their pass-1 cells ARE pairs; `default`,
        # `--no-default-features` and `--all-features` are excluded because those three runs would
        # duplicate pass-1 exactly.
        #
        # `parser` itself is NOT in the exclude list: cargo-hack rejects a feature named by both
        # `--features` and `--exclude-features` (verified against 0.6.43, "specified by both"),
        # and it does not need to be there — it already skips the `parser,parser` cell on its own.
        # Nine cells, one per remaining feature, and a feature added to the manifest later joins
        # them without anyone editing this file.
        cargo hack clippy -p smear --each-feature --features parser \
          --exclude-features rowan,lossless-coverage,validator,introspection,default \
          --exclude-no-default-features --exclude-all-features

  build:
    name: build
    strategy:
      matrix:
        os:
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Cache cargo build and registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-build-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-build-
    - name: Install Rust
      run: rustup update stable --no-self-update && rustup default stable
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Cache ~/.cargo
      uses: actions/cache@v6
      with:
        path: ~/.cargo
        key: ${{ runner.os }}-coverage-dotcargo
    - name: Run build
      run: |
        cargo hack build --each-feature
        # Pass 2 — the pairwise isolation cells the crate split used to provide by accident.
        # `smear-parser`'s own `--each-feature` run was implicitly "parser x feature", because its
        # build always contained the parser; a single-crate `--each-feature` never builds `parser`
        # together with exactly one other feature. This restores those pairs deliberately, and the
        # two that matter are `parser` x `bytes` (60 parser cfg sites) and `parser` x dialect.
        #
        # `rowan`, `lossless-coverage`, `validator` and `introspection` are excluded because they
        # already imply `parser`, so their pass-1 cells ARE pairs; `default`,
        # `--no-default-features` and `--all-features` are excluded because those three runs would
        # duplicate pass-1 exactly.
        #
        # `parser` itself is NOT in the exclude list: cargo-hack rejects a feature named by both
        # `--features` and `--exclude-features` (verified against 0.6.43, "specified by both"),
        # and it does not need to be there — it already skips the `parser,parser` cell on its own.
        # Nine cells, one per remaining feature, and a feature added to the manifest later joins
        # them without anyone editing this file.
        cargo hack build -p smear --each-feature --features parser \
          --exclude-features rowan,lossless-coverage,validator,introspection,default \
          --exclude-no-default-features --exclude-all-features

  test:
    name: test
    strategy:
      matrix:
        os:
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Cache cargo build and registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-test-
    - name: Install Rust
      run: rustup update stable --no-self-update && rustup default stable
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Cache ~/.cargo
      uses: actions/cache@v6
      with:
        path: ~/.cargo
        key: ${{ runner.os }}-coverage-dotcargo

    # No `if: runner.os == 'macOS'` guard: the matrix has one host and it is this one, so the
    # guard would be vacuously true. A vacuously-true guard is worth deleting rather than
    # keeping — if it ever evaluated false the step would skip in silence and `cargo test` would
    # link with a different linker than the one this job exists to exercise.
    - name: Install LLVM + LLD and use ld64.lld
      run: |
        brew update
        brew install llvm lld

        LLVM_PREFIX="$(brew --prefix llvm)"
        LLD_PREFIX="$(brew --prefix lld)"
        LLD_PATH="$LLD_PREFIX/bin/ld64.lld"

        # Sanity checks (helpful in logs)
        echo "LLVM_PREFIX=$LLVM_PREFIX"
        echo "LLD_PREFIX=$LLD_PREFIX"
        test -x "$LLVM_PREFIX/bin/clang" || { echo "clang missing"; exit 1; }
        test -x "$LLD_PATH" || { echo "ld64.lld missing at $LLD_PATH"; exit 1; }

        # Use Homebrew clang as the driver
        echo "PATH=$LLVM_PREFIX/bin:$PATH" >> $GITHUB_ENV
        echo "CC=$LLVM_PREFIX/bin/clang" >> $GITHUB_ENV
        echo "CXX=$LLVM_PREFIX/bin/clang++" >> $GITHUB_ENV

        # Ensure Cargo uses clang on macOS targets
        echo "CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER=$LLVM_PREFIX/bin/clang" >> $GITHUB_ENV
        echo "CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER=$LLVM_PREFIX/bin/clang" >> $GITHUB_ENV

        # Tell clang to use ld64.lld explicitly (absolute path required on macOS)
        echo "RUSTFLAGS=${RUSTFLAGS} -C linker=$LLVM_PREFIX/bin/clang -C link-arg=-fuse-ld=$LLD_PATH" >> $GITHUB_ENV

    - name: Run test
      run: cargo test --all-features -- --quiet
