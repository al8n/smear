name: CI

# ── THIS IS THE FAST LANE ───────────────────────────────────────────────────────────────────
#
# Every job here runs on `ubuntu-latest` or `windows-latest`. Nothing macOS-bound lives in this
# file: the Miri matrices are in `.github/workflows/miri.yml` and the four ordinary macOS legs
# are in `.github/workflows/macos.yml`, and those two headers carry the measurement that
# separated them.
#
# The short version: on 2026-08-06 `CI` had not concluded on any of the last four pull requests
# — two of which merged anyway — while `loc` completed on the same refs, so it was never an
# outage. On #64's run (31051592352) 29 of 39 jobs finished and every one was green, but a
# conclusion is a property of the WHOLE run, so none of those 29 verdicts was readable. The 10
# that did not finish were 8 macOS-bound jobs plus 2 ubuntu Miri cells still running, and
# `coverage` was never even created because it `needs:` matrices those macOS cells sat in.
#
# So the contract is: this workflow's conclusion is the one a merge waits for, and it is
# answerable in tens of minutes because nothing in it queues for a macOS runner. Adding a
# `runs-on: macos-*` here gives that up — the whole lane is then only as fast as its scarcest
# host, which is the state this split undid. Adding a Miri cell here gives it up for a different
# reason: Miri sets its own wall clock (4h20m for the longest cell in the last run that
# concluded) regardless of how free the runners are.

on:
  push:
    # BOTH names are load-bearing. `main` is the repository's DEFAULT branch — it is what
    # `schedule` runs, where a fresh clone lands, and where dependabot opens its pull requests.
    # `feat/tokora-0.8` is the TRUNK — it is what every feature pull request is opened against and
    # merged into. On 2026-08-06 `main` was 145 commits behind the trunk and not an ancestor of
    # it, so those are two different branches and a post-merge lane naming only one of them
    # watches the wrong ref. This list said `main` alone for the trunk's entire life: no merge
    # into the trunk ever produced a run, and `gh run list --branch feat/tokora-0.8` returned
    # nothing (#74).
    #
    # A literal name is forced here. `on:` is resolved before any context exists, so
    # `${{ github.event.repository.default_branch }}` cannot be written in this block, and there
    # is no glob to fall back on: the trunk has already been renamed twice — `refactor/main` ->
    # `refactor/main-0.8` -> `feat/tokora-0.8` — with no common prefix. A literal list will
    # therefore go stale again, and neither of those two renames deleted the branch it replaced,
    # so a stale entry here stays resolvable and silent.
    #
    # `ci/check_workflow_triggers.sh`, run by the `triggers` job below, is what makes the next one
    # loud. It does not ask what the trunk is called; it asks whether the branch this pull request
    # is being merged INTO has a push lane, and fails when it does not.
    branches:
      - main
      - feat/tokora-0.8
    # `**.md` used to sit in these lists. It cannot: `README.md`,
    # `smear-lexer/README.md` and `smear-parser/README.md` are `include_str!`-ed
    # into their crates' rustdoc, so editing one is a compile-time change to the
    # documentation, and a broken reference-style link in a README fails the
    # `docs` job below. Ignoring them meant the one job that can catch such a
    # break never ran for the one change class that causes it. Only the markdown
    # no crate compiles — `docs/` notes and the excluded `legacy/` tree — is
    # ignored.
    paths-ignore:
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - 'docs/**.md'
      - 'legacy/**.md'
      - '**.txt'
  pull_request:
    paths-ignore:
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - 'docs/**.md'
      - 'legacy/**.md'
      - '**.txt'
  workflow_dispatch:
  # KEPT here and DROPPED from `macos.yml` and `miri.yml` — the one deliberate difference between
  # the three files' trigger blocks, and the reason `ci/check_workflow_triggers.sh` locks
  # `on.push.branches` across them rather than the whole `on:` block. Two things before touching
  # it.
  #
  # A `schedule` only ever runs the DEFAULT branch's copy of a workflow, against the default
  # branch's ref. So while `main` is default and this file lives on the trunk, this line does
  # nothing at all: the weekly run that does exist (30678206309, 2026-08-01, `failure`, 1h31m) is
  # produced by `main`'s own pre-split `ci.yml`, and deleting this line would not stop a second of
  # it. That is a change to `main`, or it is made moot by retargeting the default branch — either
  # way it is not reachable from here. `macos.yml` and `miri.yml` do not exist on `main` at all,
  # so their `schedule` lines were pure decoration.
  #
  # This line is therefore a decision about what happens the moment the default branch becomes the
  # trunk. A weekly build of unchanged code earns its runner time on THIS lane — it is where a new
  # nightly, a new clippy lint or a yanked dependency shows up between merges, for ~1h31m of
  # ubuntu and windows time. It does not earn it on the other two, whose weekly cost would be a
  # 6-9h macOS queue and a 14h wall clock to re-prove what the merge that produced the code
  # already proved; see #73.
  schedule: [cron: "0 1 */7 * *"]

concurrency:
  # There was no concurrency group here at all before the split, so every push to a branch left
  # its predecessor's run alive and competing for the same runners — which fed the very queue
  # that stopped this workflow concluding. One in-flight run per workflow per ref now, so a
  # branch's CI reflects its tip rather than a backlog of superseded commits.
  #
  # Integration branches are the exception: the group is keyed on the commit SHA so that every
  # commit landing on one gets its own group and its own verdict. Do NOT collapse that back to one
  # group per ref — `cancel-in-progress: false` does not protect such a run on its own, because a
  # run queued into a group that already has one in progress cancels whichever run was PENDING
  # there regardless of that setting.
  #
  # `github.event_name == 'push'` IS the integration-branch test, exactly, without naming a
  # branch: `on.push.branches` above is the only way a push event reaches this workflow, so a push
  # run is by construction a run on a branch in that list. This read `github.ref ==
  # 'refs/heads/main'` until #74 — a third copy of a branch name that was already the wrong one.
  # Adding the trunk to the push list while leaving it would have half-fixed the issue and hidden
  # the other half: the trunk would have kept the cancelling behaviour, so with four merges in two
  # hours a run WOULD have appeared for `feat/tokora-0.8` and then been cancelled by the next
  # merge, which reads as `fail` in `gh pr checks` and is still no verdict. Keyed on the event it
  # cannot drift at the next rename.
  #
  # `${{ github.workflow }}` leading the group is what keeps the three lanes apart: `CI-...`,
  # `Miri-...` and `macOS-...` are different groups, so no lane can cancel another's run.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings -C debuginfo=0 -C codegen-units=16
  RUST_BACKTRACE: 1
  nightly: nightly
  stable: stable

jobs:
  # Check that the post-merge lanes point at the branch merges actually go to
  #
  # A workflow cannot detect its own non-execution, which is why #74 survived the trunk's entire
  # life: every lane listed `main`, every merge went to `feat/tokora-0.8`, and the only symptom was
  # `gh run list --branch feat/tokora-0.8` printing nothing. The assertion has to be made by the
  # runs that do happen. Ten seconds on ubuntu, in no `needs:` chain, so it blocks nothing and
  # costs this lane's conclusion nothing; the four invariants are documented in the script.
  triggers:
    name: triggers
    runs-on: ubuntu-latest
    # Spelled out because the script's fourth invariant asks the API whether the base branch is
    # itself the head of an open pull request — the test that tells a renamed trunk from a stacked
    # PR. Without `pull-requests: read` that query can fail depending on the repository's default
    # token permissions, and the script would then warn and skip rather than fail, which is the
    # quiet outcome this whole job exists to prevent.
    permissions:
      contents: read
      pull-requests: read
    steps:
    - uses: actions/checkout@v5
    - name: Check workflow trigger coverage
      env:
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        PR_BASE: ${{ github.base_ref }}
        GH_TOKEN: ${{ github.token }}
      run: bash ci/check_workflow_triggers.sh

  # Check formatting
  rustfmt:
    name: rustfmt
    strategy:
      matrix:
        # `macos-latest` is deliberately absent — it lives in
        # `.github/workflows/macos.yml`. See this file's header before adding it back.
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable
    - name: Check formatting
      run: cargo fmt --all -- --check


  # Apply clippy lints
  clippy:
    name: clippy
    strategy:
      matrix:
        # `macos-latest` is deliberately absent — it lives in
        # `.github/workflows/macos.yml`. See this file's header before adding it back.
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Apply clippy lints
      run: cargo hack clippy --each-feature

  # Run tests on some extra platforms
  cross:
    name: cross
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - aarch64-linux-android
          - aarch64-unknown-linux-musl
          - i686-linux-android
          - x86_64-linux-android
          - i686-pc-windows-gnu
          - x86_64-pc-windows-gnu
          - i686-unknown-linux-gnu
          - powerpc64-unknown-linux-gnu
          # - mips64-unknown-linux-gnuabi64
          - riscv64gc-unknown-linux-gnu
          - wasm32-unknown-unknown
          - wasm32-unknown-emscripten
          - wasm32-wasip1
          - wasm32-wasip1-threads
          - wasm32-wasip2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cache cargo build and registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cross-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cross-
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: cargo build --target ${{ matrix.target }}
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --target ${{ matrix.target }} 

  build:
    name: build
    strategy:
      matrix:
        # `macos-latest` is deliberately absent — it lives in
        # `.github/workflows/macos.yml`. See this file's header before adding it back.
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
    - name: Cache cargo build and registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-build-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-build-
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Cache ~/.cargo
      uses: actions/cache@v4
      with:
        path: ~/.cargo
        key: ${{ runner.os }}-coverage-dotcargo
    - name: Run build
      run: cargo hack build --each-feature
  
  test:
    name: test
    strategy:
      matrix:
        # `macos-latest` is deliberately absent — it lives in
        # `.github/workflows/macos.yml`. See this file's header before adding it back.
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
    - name: Cache cargo build and registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-test-
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Cache ~/.cargo
      uses: actions/cache@v4
      with:
        path: ~/.cargo
        key: ${{ runner.os }}-coverage-dotcargo
    - name: Use lld-link (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # lld already comes with Chocolatey llvm on GH runners; install/upgrade if needed
        choco upgrade -y llvm

        # Ensure LLVM bin is on PATH (where lld-link.exe lives)
        $llvmBin = 'C:\Program Files\LLVM\bin'
        if (-not (Test-Path $llvmBin)) {
          Write-Error "LLVM bin not found at $llvmBin"
          exit 1
        }
        echo "PATH=$llvmBin;$env:PATH" >> $env:GITHUB_ENV

        # Verify
        & "$llvmBin\lld-link.exe" --version

        # Tell Cargo to use lld-link for MSVC target
        echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=lld-link.exe" >> $env:GITHUB_ENV

        # Make PDB generation lighter & avoid incremental weirdness in CI
        echo "RUSTFLAGS=$env:RUSTFLAGS -C link-arg=/DEBUG:FASTLINK -C link-arg=/INCREMENTAL:NO" >> $env:GITHUB_ENV

    # The `if: runner.os == 'macOS'` step that used to sit here moved with the macOS leg to
    # `.github/workflows/macos.yml`; no host in this job's matrix can satisfy that guard, so
    # leaving it would have been a step that reads as coverage and compiles nothing.

    - name: Run test
      run: cargo test --all-features -- --quiet

  # Build the documentation under `-D warnings`.
  #
  # An intra-doc link is a compile-time reference, not prose: it resolves against
  # exactly the items the selected feature set compiles, and nothing else. That is
  # why `--all-features` is the one configuration that *cannot* see a cross-dialect
  # link — with both `graphql` and `graphqlx` present, every cross-dialect target
  # resolves, and a link from one dialect's tree into the other's reads as valid.
  # It is only a build that leaves a dialect out that has nothing to resolve to.
  #
  # So this job is a matrix, not a step. The `--all-features` leg catches the
  # ordinary breakage (a private target, a renamed item, a broken README
  # reference); the dialect-alone legs catch the isolation breach that reads like
  # a comment. Both are needed, and neither subsumes the other: the two links this
  # job was added for failed under `--all-features`, while the two in `smear`'s
  # facade were invisible there and only the single-dialect legs saw them.
  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
    - uses: actions/checkout@v5
    - name: Install Rust
      run: rustup update stable --no-self-update && rustup default stable
    - name: cargo doc --workspace --all-features
      run: |
        set -euo pipefail
        TD="${CARGO_TARGET_DIR:-target}"
        rm -rf "$TD/doc"
        cargo doc --workspace --all-features --no-deps
        for page in smear smear_lexer smear_parser; do
          if [ ! -f "$TD/doc/$page/index.html" ]; then
            echo "::error::cargo doc --workspace --all-features exited 0 but wrote no page for $page"
            exit 1
          fi
        done
    - name: cargo doc, one dialect at a time
      run: |
        set -euo pipefail
        TD="${CARGO_TARGET_DIR:-target}"

        # `package|features|rendered page`.
        #
        # Every leg is `--no-default-features` plus exactly one dialect, because a
        # cross-dialect link is only unresolvable when the other dialect is absent.
        # `rowan` rides along for `smear-parser` because the lossless tree — where
        # Phase B found the first such link — is compiled out without it.
        legs=(
          "smear-parser|rowan,graphql|smear_parser"
          "smear-parser|rowan,graphqlx|smear_parser"
          "smear-lexer|graphql|smear_lexer"
          "smear-lexer|graphqlx|smear_lexer"
          "smear|graphql|smear"
          "smear|graphqlx|smear"
        )

        for leg in "${legs[@]}"; do
          IFS='|' read -r pkg features page <<< "$leg"
          echo "::group::cargo doc -p $pkg --no-default-features --features $features"

          # `required-features` makes cargo *skip* a target rather than fail it, so a
          # feature set that selects nothing at all exits 0 having documented nothing,
          # and a green step is not evidence the leg ran. Each leg therefore deletes
          # its own page first and asserts it came back: the page can only exist
          # because this leg wrote it, not because an earlier leg did.
          rm -rf "$TD/doc/$page"
          cargo doc -p "$pkg" --no-default-features --features "$features" --no-deps
          if [ ! -f "$TD/doc/$page/index.html" ]; then
            echo "::error::cargo doc -p $pkg --features $features exited 0 but documented nothing"
            exit 1
          fi

          echo "::endgroup::"
        done

  # Build with exactly the MSRV declared in Cargo.toml's `rust-version`, so
  # a floor that silently drifts above the declared value is caught here
  # instead of surfacing as a hard `cargo` failure for users pinned to it.
  # Every other job runs `rustup update stable`, so without this job the
  # declared MSRV is never actually exercised by anything.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Read declared MSRV from Cargo.toml
      id: msrv
      run: |
        version=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/^rust-version *= *"([^"]+)".*/\1/')
        if [ -z "$version" ]; then
          echo "Error: could not read rust-version from Cargo.toml"
          exit 1
        fi
        echo "Declared MSRV: $version"
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - name: Install Rust ${{ steps.msrv.outputs.version }}
      run: |
        rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal --no-self-update
        rustup default ${{ steps.msrv.outputs.version }}
    - name: cargo build --workspace --all-features
      run: cargo build --workspace --all-features

  # ── THE BYTE-IDENTITY GATE ──────────────────────────────────────────────────────────────────
  #
  # Recomputes the four corpus tree hashes (`benchmarks/tests/byte_identity.rs`) and fails if any
  # has moved. Before this job the four values lived in a GitHub issue and a commit message, so a
  # change that re-shaped every tree in the corpus went green through every gate in the repository.
  #
  # WHY HERE, and not in `macos.yml` or `miri.yml`. Those two exist to hold legs that are
  # queue-bound or slow, so that `CI` can reach a conclusion — see their headers. This gate is
  # neither: it is ten seconds of pure computation whose verdict is a property of the parser's
  # output, not of the host. Putting it behind the macOS queue would mean a moved hash surfaces
  # hours after the pull request that moved it, and a second OS row would buy no extra information
  # because the dump is byte-identical across platforms by construction (the escape is a fixed
  # `char::is_control` test, deliberately not a drifting Unicode table). One Linux job, on `CI`,
  # where a red is readable on the pull request that caused it.
  #
  # WHY `--release`. Not a preference. The `prefixes` corpus is ~9,300 documents and ~45 million
  # lines of dump; in an unoptimised build it does not finish inside ten minutes, while in release
  # all four corpora hash in about ten seconds. That is also why the test carries `#[ignore]` and
  # why `--include-ignored` is spelled out here: `cargo test` defaults to debug, so the expensive
  # corpus is opted into exactly once, in the one place that runs it in release. The three cheap
  # corpora are additionally covered by the ordinary `test` job above, which needs no opt-in.
  #
  # WHY `--test byte_identity` RATHER THAN A FILTER. A cargo target filter that matches nothing
  # warns and exits 0; a named `--test` target that has been renamed or deleted is a hard error.
  # This job must fail loudly if the gate stops existing, which is the failure mode that would
  # otherwise leave a green tick over no coverage at all.
  byte-identity:
    name: byte-identity
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install Rust
      run: rustup update stable --no-self-update && rustup default stable
    - name: Cache cargo build and registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-byte-identity-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-byte-identity-
    - name: cargo test --release --test byte_identity -- --include-ignored
      run: cargo test -p smear-apollo-bench --release --test byte_identity -- --include-ignored

  # `needs:` is unchanged, but its effect is not. Every matrix named below used to contain a
  # `macos-latest` cell, so on a run where those cells never got a runner this job was never
  # created at all — it does not appear in the job list of #64's or #66's run. With the macOS
  # cells gone from those matrices it becomes reachable again, which means the first runs after
  # this change are the first time in a while that anything has watched `coverage` finish.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs:
      - rustfmt
      - clippy
      - build
      - cross
      - test
    steps:
      - uses: actions/checkout@v5
      - name: Install latest nightly
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true
      - uses: actions-rs/install@v0.1
        with:
          crate: cargo-tarpaulin
          version: latest
      - name: Cache ~/.cargo
        uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-coverage-dotcargo
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-coverage-cargo-build-target
      - name: Run tarpaulin
        uses: actions-rs/cargo@v1
        with:
          command: tarpaulin
          args: --no-default-features --features graphql --run-types tests --run-types doctests --workspace --out xml -- --quiet
      - name: Upload to codecov.io
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          fail_ci_if_error: true
