name: CI

# ── THIS IS THE FAST LANE ───────────────────────────────────────────────────────────────────
#
# Every job here runs on `ubuntu-latest` or `windows-latest`. Nothing macOS-bound lives in this
# file: the Miri matrices are in `.github/workflows/miri.yml` and the four ordinary macOS legs
# are in `.github/workflows/macos.yml`, and those two headers carry the measurement that
# separated them.
#
# The short version: on 2026-08-06 `CI` had not concluded on any of the last four pull requests
# — two of which merged anyway — while `loc` completed on the same refs, so it was never an
# outage. On #64's run (31051592352) 29 of 39 jobs finished and every one was green, but a
# conclusion is a property of the WHOLE run, so none of those 29 verdicts was readable. The 10
# that did not finish were 8 macOS-bound jobs plus 2 ubuntu Miri cells still running, and
# `coverage` was never even created because it `needs:` matrices those macOS cells sat in.
#
# So the contract is: this workflow's conclusion is the one a merge waits for, and it is
# answerable in tens of minutes because nothing in it queues for a macOS runner. Adding a
# `runs-on: macos-*` here gives that up — the whole lane is then only as fast as its scarcest
# host, which is the state this split undid. Adding a Miri cell here gives it up for a different
# reason: Miri sets its own wall clock (4h20m for the longest cell in the last run that
# concluded) regardless of how free the runners are.

on:
  push:
    # BOTH names are load-bearing. `main` is the repository's DEFAULT branch — it is what
    # `schedule` runs, where a fresh clone lands, and where dependabot opens its pull requests.
    # `feat/tokora-0.8` is the TRUNK — it is what every feature pull request is opened against and
    # merged into. On 2026-08-06 `main` was 145 commits behind the trunk and not an ancestor of
    # it, so those are two different branches and a post-merge lane naming only one of them
    # watches the wrong ref. This list said `main` alone for the trunk's entire life: no merge
    # into the trunk ever produced a run, and `gh run list --branch feat/tokora-0.8` returned
    # nothing (#74).
    #
    # A literal name is forced here. `on:` is resolved before any context exists, so
    # `${{ github.event.repository.default_branch }}` cannot be written in this block, and there
    # is no glob to fall back on: the trunk has already been renamed twice — `refactor/main` ->
    # `refactor/main-0.8` -> `feat/tokora-0.8` — with no common prefix. A literal list will
    # therefore go stale again, and neither of those two renames deleted the branch it replaced,
    # so a stale entry here stays resolvable and silent.
    #
    # `ci/check_workflow_triggers.sh`, run by the `triggers` job below, is what makes the next one
    # loud. It does not ask what the trunk is called; it asks whether the branch this pull request
    # is being merged INTO has a push lane, and fails when it does not.
    branches:
      - main
      - feat/tokora-0.8
    # `**.md` used to sit in these lists. It cannot: `README.md`,
    # `smear/src/lexer/README.md` and `smear/src/parser/README.md` are
    # `include_str!`-ed into the crate's rustdoc, so editing one is a compile-time
    # change to the documentation, and a broken reference-style link in a README
    # fails the `docs` job below. Ignoring them meant the one job that can catch such a
    # break never ran for the one change class that causes it. Only the markdown
    # no crate compiles — `docs/` notes and the excluded `legacy/` tree — is
    # ignored.
    paths-ignore:
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - 'docs/**.md'
      - 'legacy/**.md'
      - '**.txt'
  pull_request:
    paths-ignore:
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - 'docs/**.md'
      - 'legacy/**.md'
      - '**.txt'
  workflow_dispatch:
  # KEPT here and DROPPED from `macos.yml` and `miri.yml` — the one deliberate difference between
  # the three files' trigger blocks, and the reason `ci/check_workflow_triggers.sh` locks
  # `on.push.branches` across them rather than the whole `on:` block. Two things before touching
  # it.
  #
  # A `schedule` only ever runs the DEFAULT branch's copy of a workflow, against the default
  # branch's ref. So while `main` is default and this file lives on the trunk, this line does
  # nothing at all: the weekly run that does exist (30678206309, 2026-08-01, `failure`, 1h31m) is
  # produced by `main`'s own pre-split `ci.yml`, and deleting this line would not stop a second of
  # it. That is a change to `main`, or it is made moot by retargeting the default branch — either
  # way it is not reachable from here. `macos.yml` and `miri.yml` do not exist on `main` at all,
  # so their `schedule` lines were pure decoration.
  #
  # This line is therefore a decision about what happens the moment the default branch becomes the
  # trunk. A weekly build of unchanged code earns its runner time on THIS lane — it is where a new
  # nightly, a new clippy lint or a yanked dependency shows up between merges, for ~1h31m of
  # ubuntu and windows time. It does not earn it on the other two, whose weekly cost would be a
  # 6-9h macOS queue and a 14h wall clock to re-prove what the merge that produced the code
  # already proved; see #73.
  schedule: [cron: "0 1 */7 * *"]

concurrency:
  # There was no concurrency group here at all before the split, so every push to a branch left
  # its predecessor's run alive and competing for the same runners — which fed the very queue
  # that stopped this workflow concluding. One in-flight run per workflow per ref now, so a
  # branch's CI reflects its tip rather than a backlog of superseded commits.
  #
  # Integration branches are the exception: the group is keyed on the commit SHA so that every
  # commit landing on one gets its own group and its own verdict. Do NOT collapse that back to one
  # group per ref — `cancel-in-progress: false` does not protect such a run on its own, because a
  # run queued into a group that already has one in progress cancels whichever run was PENDING
  # there regardless of that setting.
  #
  # `github.event_name == 'push'` IS the integration-branch test, exactly, without naming a
  # branch: `on.push.branches` above is the only way a push event reaches this workflow, so a push
  # run is by construction a run on a branch in that list. This read `github.ref ==
  # 'refs/heads/main'` until #74 — a third copy of a branch name that was already the wrong one.
  # Adding the trunk to the push list while leaving it would have half-fixed the issue and hidden
  # the other half: the trunk would have kept the cancelling behaviour, so with four merges in two
  # hours a run WOULD have appeared for `feat/tokora-0.8` and then been cancelled by the next
  # merge, which reads as `fail` in `gh pr checks` and is still no verdict. Keyed on the event it
  # cannot drift at the next rename.
  #
  # `${{ github.workflow }}` leading the group is what keeps the three lanes apart: `CI-...`,
  # `Miri-...` and `macOS-...` are different groups, so no lane can cancel another's run.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

# ── EVERY `run:` IN THIS FILE IS BASH ───────────────────────────────────────────────────────
#
# GitHub picks the shell from the HOST when a step does not say: `bash -e {0}` on ubuntu and
# macOS, but `pwsh` on Windows. So a `run:` block is written once and parsed by two different
# languages, and the ubuntu cell of a matrix cannot tell you that the windows cell will not
# even lex. That is a build failure, not a Rust failure, and it happened: #84 added a two-pass
# `cargo hack` invocation to `clippy` and `build` with a backslash line continuation — bash
# syntax — and both `(windows-latest)` cells of run 31085548219 died before cargo started, with
# `ParserError: ...ps1:19 | Missing expression after unary operator '--'`. PowerShell has no
# `\` continuation, so it read `--exclude-features` as a unary minus applied to a minus.
#
# WHY THE FILE-WIDE DEFAULT RATHER THAN `shell: bash` ON THE TWO STEPS THAT BURNED. The
# per-step form fixes those two and leaves the trap armed for the third: the next multi-line
# `run:` added to any windows-hosted job here — a `\`, a `$(...)`, a heredoc, a `case` — fails
# the same way, and the author gets the same unreadable ParserError. This file already carries
# `ci/check_workflow_triggers.sh` because a CI invariant kept by discipline is a CI invariant
# that goes stale. A default cannot go stale: a step has to opt OUT to get the old behaviour.
#
# AND WHY IT IS SAFE TO IMPOSE ON EVERY STEP. Checked, not assumed. Exactly one step in this
# repository is written in PowerShell — `Use lld-link (Windows)` in the `test` job below, with
# its `$env:GITHUB_ENV`, `Test-Path` and `&` call operator — and it declares `shell: pwsh`
# itself. A step-level `shell:` overrides `defaults.run.shell`, so that step is untouched by
# this block; it is also the reason the default is safe to state so broadly, and the reason to
# keep its explicit `shell:` if it is ever edited.
#
# The one behaviour this DOES change on ubuntu: naming bash explicitly selects
# `bash --noprofile --norc -eo pipefail {0}` where the host default was `bash -e {0}`, so
# `pipefail` is now on everywhere. Audited across this file — the `docs` steps already `set -o
# pipefail` themselves, nothing else in a `run:` block pipes anything, and the single
# exception is the `msrv` job's `grep | sed`, guarded at that step with the note explaining it.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings -C debuginfo=0 -C codegen-units=16
  RUST_BACKTRACE: 1
  nightly: nightly
  stable: stable

jobs:
  # Check that the post-merge lanes point at the branch merges actually go to
  #
  # A workflow cannot detect its own non-execution, which is why #74 survived the trunk's entire
  # life: every lane listed `main`, every merge went to `feat/tokora-0.8`, and the only symptom was
  # `gh run list --branch feat/tokora-0.8` printing nothing. The assertion has to be made by the
  # runs that do happen. Ten seconds on ubuntu, in no `needs:` chain, so it blocks nothing and
  # costs this lane's conclusion nothing; the four invariants are documented in the script.
  triggers:
    name: triggers
    runs-on: ubuntu-latest
    # Spelled out because the script's fourth invariant asks the API whether the base branch is
    # itself the head of an open pull request — the test that tells a renamed trunk from a stacked
    # PR. Without `pull-requests: read` that query can fail depending on the repository's default
    # token permissions, and the script would then warn and skip rather than fail, which is the
    # quiet outcome this whole job exists to prevent.
    permissions:
      contents: read
      pull-requests: read
    steps:
    - uses: actions/checkout@v5
    - name: Check workflow trigger coverage
      env:
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        PR_BASE: ${{ github.base_ref }}
        GH_TOKEN: ${{ github.token }}
      run: bash ci/check_workflow_triggers.sh

  # Check formatting
  rustfmt:
    name: rustfmt
    strategy:
      matrix:
        # `macos-latest` is deliberately absent — it lives in
        # `.github/workflows/macos.yml`. See this file's header before adding it back.
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable
    - name: Check formatting
      run: cargo fmt --all -- --check


  # Apply clippy lints
  clippy:
    name: clippy
    strategy:
      matrix:
        # `macos-latest` is deliberately absent — it lives in
        # `.github/workflows/macos.yml`. See this file's header before adding it back.
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Apply clippy lints
      run: |
        cargo hack clippy --each-feature
        # Pass 2 — the pairwise isolation cells the crate split used to provide by accident.
        # `smear-parser`'s own `--each-feature` run was implicitly "parser x feature", because its
        # build always contained the parser; a single-crate `--each-feature` never builds `parser`
        # together with exactly one other feature. This restores those pairs deliberately, and the
        # two that matter are `parser` x `bytes` (60 parser cfg sites) and `parser` x dialect.
        #
        # `rowan`, `lossless-coverage`, `validator` and `introspection` are excluded because they
        # already imply `parser`, so their pass-1 cells ARE pairs; `default`,
        # `--no-default-features` and `--all-features` are excluded because those three runs would
        # duplicate pass-1 exactly.
        #
        # `parser` itself is NOT in the exclude list: cargo-hack rejects a feature named by both
        # `--features` and `--exclude-features` (verified against 0.6.43, "specified by both"),
        # and it does not need to be there — it already skips the `parser,parser` cell on its own.
        # Nine cells, one per remaining feature, and a feature added to the manifest later joins
        # them without anyone editing this file.
        cargo hack clippy -p smear --each-feature --features parser \
          --exclude-features rowan,lossless-coverage,validator,introspection,default \
          --exclude-no-default-features --exclude-all-features

  # Run tests on some extra platforms
  cross:
    name: cross
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - aarch64-linux-android
          - aarch64-unknown-linux-musl
          - i686-linux-android
          - x86_64-linux-android
          - i686-pc-windows-gnu
          - x86_64-pc-windows-gnu
          - i686-unknown-linux-gnu
          - powerpc64-unknown-linux-gnu
          # - mips64-unknown-linux-gnuabi64
          - riscv64gc-unknown-linux-gnu
          - wasm32-unknown-unknown
          - wasm32-unknown-emscripten
          - wasm32-wasip1
          - wasm32-wasip1-threads
          - wasm32-wasip2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cache cargo build and registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cross-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cross-
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: cargo build --target ${{ matrix.target }}
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --target ${{ matrix.target }}

  # The validator's schema representation, on a core with no compare-and-swap.
  #
  # NOT a cell of the `cross` matrix above, and it cannot become one: that job builds the whole
  # workspace, and `smear` does not build for `thumbv6m-none-eabi` — its syntactic AST offers an
  # `Arc`-backed spelling of recursive list types, which needs `alloc::sync`. The claim under test
  # is narrower and is the one the design rests on: `Schema` holds no `Arc`, no atomics and no
  # interior mutability and depends on nothing but `core` and `alloc`, so an embedded core can
  # hold one and the caller picks the pointer.
  #
  # `-p smear-noatomic` names the package rather than filtering, so a rename is a hard error here
  # instead of a warn-and-exit-0. That member `#[path]`-includes `smear`'s own representation
  # files, so this builds the shipped source and not a copy of it — verified to discriminate by
  # adding an `Arc` to the representation, which fails with "cannot find `sync` in `std`".
  noatomic:
    name: noatomic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cache cargo build and registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-noatomic-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-noatomic-
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: cargo build -p smear-noatomic --target thumbv6m-none-eabi
        run: |
          rustup target add thumbv6m-none-eabi
          cargo build -p smear-noatomic --target thumbv6m-none-eabi
      # An empty `[dependencies]` table is the other half of the claim, and a comment cannot
      # enforce it. Read out of `cargo metadata` so a dependency added to the manifest fails here
      # rather than quietly widening what the target build proves.
      - name: the representation depends on nothing
        run: |
          DEPS="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; p=[x for x in json.load(sys.stdin)["packages"] if x["name"]=="smear-noatomic"][0]; print(len(p["dependencies"]))')"
          if [ "$DEPS" != "0" ]; then
            echo "::error::smear-noatomic declares $DEPS dependencies; the whole point of the member is that it declares none"
            exit 1
          fi

  build:
    name: build
    strategy:
      matrix:
        # `macos-latest` is deliberately absent — it lives in
        # `.github/workflows/macos.yml`. See this file's header before adding it back.
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
    - name: Cache cargo build and registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-build-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-build-
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Cache ~/.cargo
      uses: actions/cache@v4
      with:
        path: ~/.cargo
        key: ${{ runner.os }}-coverage-dotcargo
    - name: Run build
      run: |
        cargo hack build --each-feature
        # Pass 2 — the pairwise isolation cells the crate split used to provide by accident.
        # `smear-parser`'s own `--each-feature` run was implicitly "parser x feature", because its
        # build always contained the parser; a single-crate `--each-feature` never builds `parser`
        # together with exactly one other feature. This restores those pairs deliberately, and the
        # two that matter are `parser` x `bytes` (60 parser cfg sites) and `parser` x dialect.
        #
        # `rowan`, `lossless-coverage`, `validator` and `introspection` are excluded because they
        # already imply `parser`, so their pass-1 cells ARE pairs; `default`,
        # `--no-default-features` and `--all-features` are excluded because those three runs would
        # duplicate pass-1 exactly.
        #
        # `parser` itself is NOT in the exclude list: cargo-hack rejects a feature named by both
        # `--features` and `--exclude-features` (verified against 0.6.43, "specified by both"),
        # and it does not need to be there — it already skips the `parser,parser` cell on its own.
        # Nine cells, one per remaining feature, and a feature added to the manifest later joins
        # them without anyone editing this file.
        cargo hack build -p smear --each-feature --features parser \
          --exclude-features rowan,lossless-coverage,validator,introspection,default \
          --exclude-no-default-features --exclude-all-features
        # Pass 3 — the four criterion benches, which NOTHING ELSE IN CI COMPILES.
        #
        # Measured on this tree: `cargo test`'s default target selection is lib + bins + tests +
        # examples; a `[[bench]]` target is not in it, and neither `cargo build --workspace
        # --all-features` (the `msrv` job) nor `cargo hack build --each-feature` above builds
        # one. So while the benches lived in `smear/benches/` they were compiled by no gate at
        # all — `#73`'s family exactly, a target that exists and that nothing ever proves builds.
        #
        # That was survivable when the benches sat beside the fixtures they `include_str!`. It
        # is not now: `smear-benches` reaches across a member boundary for all 29 of them
        # (`../../smear/tests/fixtures/...`), so a fixture rename would break four bench targets
        # and every other job would stay green. `--benches` names a target KIND on a package
        # that has nothing else, so there is no filter here that can match zero targets and
        # exit 0.
        #
        # Build, not run: criterion sampling is minutes per target and this is a compile gate.
        cargo build -p smear-benches --benches

  test:
    name: test
    strategy:
      matrix:
        # `macos-latest` is deliberately absent — it lives in
        # `.github/workflows/macos.yml`. See this file's header before adding it back.
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
    - name: Cache cargo build and registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-test-
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Cache ~/.cargo
      uses: actions/cache@v4
      with:
        path: ~/.cargo
        key: ${{ runner.os }}-coverage-dotcargo
    - name: Use lld-link (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # lld already comes with Chocolatey llvm on GH runners; install/upgrade if needed
        choco upgrade -y llvm

        # Ensure LLVM bin is on PATH (where lld-link.exe lives)
        $llvmBin = 'C:\Program Files\LLVM\bin'
        if (-not (Test-Path $llvmBin)) {
          Write-Error "LLVM bin not found at $llvmBin"
          exit 1
        }
        echo "PATH=$llvmBin;$env:PATH" >> $env:GITHUB_ENV

        # Verify
        & "$llvmBin\lld-link.exe" --version

        # Tell Cargo to use lld-link for MSVC target
        echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=lld-link.exe" >> $env:GITHUB_ENV

        # Make PDB generation lighter & avoid incremental weirdness in CI
        echo "RUSTFLAGS=$env:RUSTFLAGS -C link-arg=/DEBUG:FASTLINK -C link-arg=/INCREMENTAL:NO" >> $env:GITHUB_ENV

    # The `if: runner.os == 'macOS'` step that used to sit here moved with the macOS leg to
    # `.github/workflows/macos.yml`; no host in this job's matrix can satisfy that guard, so
    # leaving it would have been a step that reads as coverage and compiles nothing.

    - name: Run test
      run: cargo test --all-features -- --quiet

  # Build the documentation under `-D warnings`.
  #
  # An intra-doc link is a compile-time reference, not prose: it resolves against
  # exactly the items the selected feature set compiles, and nothing else. That is
  # why `--all-features` is the one configuration that *cannot* see a cross-dialect
  # link — with both `graphql` and `graphqlx` present, every cross-dialect target
  # resolves, and a link from one dialect's tree into the other's reads as valid.
  # It is only a build that leaves a dialect out that has nothing to resolve to.
  #
  # So this job is a matrix, not a step. The `--all-features` leg catches the
  # ordinary breakage (a private target, a renamed item, a broken README
  # reference); the dialect-alone legs catch the isolation breach that reads like
  # a comment. Both are needed, and neither subsumes the other: the two links this
  # job was added for failed under `--all-features`, while the two in `smear`'s
  # facade were invisible there and only the single-dialect legs saw them.
  #
  # A third leg joined them in #65, on the same principle and for a different class:
  # `--cfg docsrs`, which is the only configuration that expands a `doc(cfg(...))` at
  # all. Read the steps for the reasoning; the short version is that both legs above
  # compile every `#[cfg_attr(docsrs, doc(cfg(...)))]` in the workspace away to nothing
  # and therefore cannot tell a correct one from a misapplied one, while docs.rs builds
  # WITH the cfg. Its two steps also gate the two halves of that mechanism separately —
  # the attributes being right, and the manifests telling docs.rs to pass the cfg — for
  # the reason recorded on the second one.
  #
  # WHY ALL OF THIS IS IN `ci.yml`. The same test `byte-identity` above applies:
  # `macos.yml` and `miri.yml` exist to hold legs that are queue-bound or set their own clock, so
  # that this workflow can reach a conclusion. A `cargo doc --no-deps` run is neither —
  # it is a couple of minutes of compilation whose verdict is a property of the source,
  # not of the host, and rustdoc's output does not vary by platform. A second OS row
  # would buy no information, and putting the leg behind the macOS queue would surface a
  # broken badge hours after the pull request that broke it. It also belongs in this
  # *job* rather than a new one: the three legs are one gate family that differ only in
  # the rustdoc configuration under test, and they share a checkout and a warm target
  # directory.
  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
    - uses: actions/checkout@v5
    - name: Install Rust
      run: rustup update stable --no-self-update && rustup default stable
    - name: cargo doc --workspace --all-features
      run: |
        set -euo pipefail
        TD="${CARGO_TARGET_DIR:-target}"
        rm -rf "$TD/doc"
        cargo doc --workspace --all-features --no-deps
        for page in smear; do
          if [ ! -f "$TD/doc/$page/index.html" ]; then
            echo "::error::cargo doc --workspace --all-features exited 0 but wrote no page for $page"
            exit 1
          fi
        done
    - name: cargo doc, one dialect at a time
      run: |
        set -euo pipefail
        TD="${CARGO_TARGET_DIR:-target}"

        # `package|features|rendered page`.
        #
        # Every leg is `--no-default-features` plus exactly one dialect, because a
        # cross-dialect link is only unresolvable when the other dialect is absent.
        # `rowan` rides along on the parser-side legs because the lossless tree —
        # where Phase B found the first such link — is compiled out without it, and
        # `rowan` implies `parser`, so those two legs document the tower while the
        # bare-dialect legs document the crate as the lexer alone. Six legs became
        # four with the merge: the facade's own pair tested resolution forwarding
        # through a layer that no longer exists.
        legs=(
          "smear|rowan,graphql|smear"
          "smear|rowan,graphqlx|smear"
          "smear|graphql|smear"
          "smear|graphqlx|smear"
        )

        for leg in "${legs[@]}"; do
          IFS='|' read -r pkg features page <<< "$leg"
          echo "::group::cargo doc -p $pkg --no-default-features --features $features"

          # `required-features` makes cargo *skip* a target rather than fail it, so a
          # feature set that selects nothing at all exits 0 having documented nothing,
          # and a green step is not evidence the leg ran. Each leg therefore deletes
          # its own page first and asserts it came back: the page can only exist
          # because this leg wrote it, not because an earlier leg did.
          rm -rf "$TD/doc/$page"
          cargo doc -p "$pkg" --no-default-features --features "$features" --no-deps
          if [ ! -f "$TD/doc/$page/index.html" ]; then
            echo "::error::cargo doc -p $pkg --features $features exited 0 but documented nothing"
            exit 1
          fi

          echo "::endgroup::"
        done

    # ── The docs.rs configuration ──────────────────────────────────────────────
    #
    # The ONLY leg that expands `doc(cfg(...))`. `#[cfg_attr(docsrs, doc(cfg(...)))]`
    # is inert without `--cfg docsrs`, so the two steps above compile every one of
    # them away to nothing — a misapplied attribute and a correct one look identical
    # to them. docs.rs builds WITH the cfg, which is the entire reason the idiom
    # exists, so a fault only this leg can see is a real published-docs failure found
    # after publication.
    #
    # tokora hit exactly that in its #195: ten attributes sat on block expressions
    # rather than on items and took `cargo +nightly doc` to exit 101 while every other
    # gate was green. smear's own instance was the mirror image (#65) — the attributes
    # were correct and no manifest declared `[package.metadata.docs.rs]`, so docs.rs
    # never passed the cfg and the badges had never rendered. Same silence, opposite
    # mechanism; this step and the one after it are the two halves.
    #
    # Nightly, because `doc(cfg)` is a nightly feature and the crates gate it behind
    # `#![cfg_attr(docsrs, feature(doc_cfg))]` — the same toolchain docs.rs uses.
    #
    # `--workspace --all-features` rather than the one published crate by name:
    # `all-features = true` is what every publishable manifest declares, so this is
    # literally the command docs.rs runs, and naming crates would leave the next one
    # added uncovered until somebody remembered to extend a list.
    - name: Install Rust (nightly, for the docs.rs configuration)
      run: rustup toolchain install nightly --no-self-update
    - name: RUSTDOCFLAGS="--cfg docsrs -D warnings" cargo +nightly doc --workspace --all-features --no-deps
      env:
        RUSTDOCFLAGS: --cfg docsrs -D warnings
      run: |
        set -euo pipefail
        TD="${CARGO_TARGET_DIR:-target}"
        rm -rf "$TD/doc"
        cargo +nightly doc --workspace --all-features --no-deps

        for page in smear; do
          if [ ! -f "$TD/doc/$page/index.html" ]; then
            echo "::error::cargo +nightly doc --cfg docsrs exited 0 but wrote no page for $page"
            exit 1
          fi
        done

        # The assertion that makes this leg self-verifying, and it is not decoration.
        # Everything above still exits 0 if `--cfg docsrs` never reaches rustdoc — a
        # typo in the env key, a `RUSTDOCFLAGS` overwritten by a later edit, the flag
        # dropped in a refactor — and the result is a green leg that expands nothing,
        # which is precisely the inert state #65 was about. The rendered badge is the
        # only direct evidence the cfg was in effect.
        #
        # A floor of one, deliberately, not a per-attribute census. `--cfg docsrs` is
        # all-or-nothing for an invocation, so one badge proves the mechanism for all
        # of them; the per-attribute failure is a MISAPPLIED attribute, and that is a
        # hard error above, not a missing badge. A pinned count would red on every
        # honest edit and buy nothing this does not already have.
        #
        # `|| true` inside the group, not after the pipe: `set -o pipefail` is on, and
        # grep exits 1 when it matches nothing — which is the case this check exists to
        # report, so it has to reach the `if` rather than kill the step first.
        badges=$( { grep -rl 'Available on crate feature' "$TD/doc/smear" || true; } | wc -l )
        echo "pages carrying a rendered doc(cfg) badge: $badges"
        if [ "$badges" -lt 1 ]; then
          echo "::error::cargo +nightly doc exited 0 but rendered no doc(cfg) badge — --cfg docsrs did not reach rustdoc, so every cfg_attr(docsrs, ...) in the workspace was compiled away and this leg tested nothing"
          exit 1
        fi

    # The other half, and the half that would actually have caught #65. The step above
    # passes `--cfg docsrs` itself, so it proves the ATTRIBUTES are right while saying
    # nothing about whether docs.rs will ever pass the cfg — that is a property of the
    # manifests, and for the whole life of the repository no manifest had it. A gate on
    # the attributes alone would have stayed green through the entire defect.
    #
    # Derived from `cargo metadata` over every workspace member rather than a list of
    # three crate names, so a crate added later is covered the day it is added. Keyed on
    # `publish`: cargo reports `[]` for `publish = false` and null otherwise, so
    # `smear-apollo-bench` — a bench harness docs.rs will never build — is skipped
    # without being named.
    - name: every publishable crate declares [package.metadata.docs.rs]
      run: |
        set -euo pipefail
        META="${RUNNER_TEMP:-/tmp}/cargo-metadata.json"
        cargo metadata --no-deps --format-version 1 > "$META"

        # A quoted heredoc delimiter, so the shell expands nothing between here and
        # `PY` and the script can use whichever quotes read best. `python3 -c '...'`
        # cannot: the body would sit inside shell single quotes, and every quote in it
        # would need escaping.
        python3 - "$META" <<'PY'
        import json, sys

        with open(sys.argv[1]) as handle:
            packages = json.load(handle)["packages"]

        checked, missing = [], []
        for pkg in packages:
            # cargo reports `[]` for `publish = false` and null for a publishable crate.
            if pkg.get("publish") == []:
                continue
            docsrs = (pkg.get("metadata") or {}).get("docs", {}).get("rs")
            if docsrs is None:
                missing.append(f'{pkg["name"]}: no [package.metadata.docs.rs] table')
                continue
            args = docsrs.get("rustdoc-args", [])
            if "--cfg" not in args or "docsrs" not in args:
                missing.append(f'{pkg["name"]}: rustdoc-args does not pass --cfg docsrs (got {args!r})')
            else:
                checked.append(pkg["name"])

        for name in sorted(checked):
            print(f'ok: {name} declares rustdoc-args = ["--cfg", "docsrs"]')

        # A filter that matches everything leaves nothing to check and still exits 0,
        # which is the shape of green this whole issue is about.
        if not checked and not missing:
            print("::error::no publishable workspace member was checked, so this gate proved nothing")
            sys.exit(1)

        for problem in missing:
            print(f"::error::{problem}")
        if missing:
            print("::error::without that table docs.rs does not pass --cfg docsrs, so every cfg_attr(docsrs, doc(cfg(...))) in the crate is inert ON DOCS.RS, not merely in CI — see #65")
            sys.exit(1)
        PY

  # Gate: the crate can actually be published
  #
  # Until #101 it could not, and never had been able to. `smear/src/lib.rs` opened with
  # `#![doc = include_str!("../../README.md")]` — a path ABOVE the package root — so
  # `cargo publish --dry-run -p smear` packaged the whole crate — 1290 files at 807960f, where
  # this was found — and then died inside the verification build with
  # `couldn't read src/../../README.md: No such file or directory`, exit 101. The packaging half
  # always succeeded, which is what made it look fine from the outside; the workspace-root README
  # is simply not in the crate's tarball and no manifest key can put it there.
  #
  # NOTHING IN THIS REPOSITORY REPORTED THAT. The only other occurrence of the word `publish` in
  # these four workflows is the `docs` job above reading `publish` out of `cargo metadata` to
  # decide which members need a docs.rs table — a manifest query, not a build. So the defect was
  # invisible for the crate's entire life and would have been found by the `cargo publish` of the
  # 0.1 release itself: after the version bump, the tag and the changelog, at the one moment the
  # answer is most expensive to get.
  #
  # WHY `-p smear` AND NOT A FILTER. The same rule `byte-identity` below is written around, and
  # the reason it is worth stating twice: a cargo target FILTER that matches nothing warns and
  # exits 0, so a gate phrased as one turns green the moment the thing it watches is renamed or
  # deleted. `-p` names a PACKAGE and cargo hard-errors on one that does not exist. If this crate
  # is ever renamed this line fails loudly instead of quietly ceasing to cover anything.
  #
  # WHY THE FAST LANE. `cargo publish --dry-run` is a full dev-profile verification build of the
  # packaged copy, which is the whole cost: measured at 29-35s on an M-series laptop, warm
  # dependency cache and cold target directory alike, against the ~3m the `test` matrix in this
  # same file takes. It needs no macOS runner and sets no clock of its own, so it does not touch
  # either of the two things this workflow's header protects. It is deliberately outside every
  # `needs:` chain — it blocks nothing and nothing blocks it, so no failure elsewhere in the lane
  # can stop this verdict from being produced.
  #
  # Default features on purpose. That is the configuration the registry verifies and the one
  # `cargo add smear` resolves to; `--all-features` is a different question and `docs` above
  # already asks it.
  publish-dry-run:
    name: publish-dry-run
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    # First, and before anything is installed or built, because it costs milliseconds and the
    # two steps below cannot see what it checks.
    #
    # The hash assertion at the end of this job compares CONTENT, so it stays green if somebody
    # replaces the symlink with a byte-identical copy of the root README — and a copy is exactly
    # the thing that drifts, silently, until the published README and the GitHub landing page
    # are two different documents. Pinning the mode is what makes "there is one README" a
    # property of the repository rather than of the day it was last checked.
    #
    # Lifted from the sibling `tokora` repository's `pages.yml`, which guards `tokora/README.md`
    # with these same two lines.
    - name: Assert smear/README.md is still a symlink to the root README
      run: |
        set -euo pipefail
        mode=$(git ls-files -s smear/README.md | awk '{print $1}')
        target=$(readlink smear/README.md || true)
        if [ "$mode" != "120000" ] || [ "$target" != "../README.md" ]; then
          echo "::error::smear/README.md must be a symlink to ../README.md (git mode 120000)"
          echo "::error::got git mode '$mode', readlink '$target'"
          echo "::error::a regular file here is a second copy of the README that will drift from the root one; see the readme key in smear/Cargo.toml"
          exit 1
        fi
        echo "ok: smear/README.md is mode 120000 -> ../README.md"
    - name: Install Rust
      run: rustup update stable --no-self-update && rustup default stable
    - name: Cache cargo build and registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-publish-dry-run-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-publish-dry-run-
    - name: cargo publish --dry-run -p smear
      run: cargo publish --dry-run -p smear
    # The dry run passing is necessary and NOT sufficient, and the gap is specific.
    # `smear/README.md` is a symlink to the workspace-root `README.md`, which cargo resolves by
    # copying the TARGET into the package. A checkout that did not create the symlink — Windows
    # without `core.symlinks`, an export that dereferenced nothing, a future commit replacing it
    # with a stub — leaves a 12-byte text file holding the string `../README.md`, and
    # `include_str!` on that compiles perfectly. The crate would publish and docs.rs would render
    # twelve bytes. The step above cannot see it; this one exists for exactly that.
    #
    # Written against the extracted package tree rather than the `.crate` archive because
    # cargo's temporary archive path has moved between releases (`package/` -> `package/tmp-crate/`
    # as of 1.99) while the extracted tree has not.
    - name: Assert the packaged README is the real one
      run: |
        set -euo pipefail
        TD="${CARGO_TARGET_DIR:-target}"
        version=$(cargo metadata --no-deps --format-version 1 \
          | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="smear"))')
        packaged="$TD/package/smear-$version/README.md"

        if [ ! -f "$packaged" ]; then
          echo "::error::the dry run exited 0 but left no packaged README at $packaged, so this gate proved nothing"
          exit 1
        fi

        want=$(sha256sum README.md | cut -d' ' -f1)
        got=$(sha256sum "$packaged" | cut -d' ' -f1)
        if [ "$want" != "$got" ]; then
          echo "::error::smear/README.md did not materialise the workspace-root README into the package"
          echo "::error::root sha256=$want, packaged sha256=$got, packaged size=$(wc -c < "$packaged") bytes"
          echo "::error::a packaged size near 12 bytes means the symlink was checked out as a text stub; see the readme key in smear/Cargo.toml"
          exit 1
        fi
        echo "ok: packaged README is byte-identical to the workspace-root README ($(wc -c < "$packaged") bytes)"

  # Build with exactly the MSRV declared in Cargo.toml's `rust-version`, so
  # a floor that silently drifts above the declared value is caught here
  # instead of surfacing as a hard `cargo` failure for users pinned to it.
  # Every other job runs `rustup update stable`, so without this job the
  # declared MSRV is never actually exercised by anything.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Read declared MSRV from Cargo.toml
      id: msrv
      run: |
        # `|| true` inside the group, and the same idiom for the same reason as the `docs` job's
        # badge count below: `defaults.run.shell: bash` at the top of this file turns `pipefail`
        # on, and `grep` exits 1 when it matches nothing. Without the guard a missing
        # `rust-version` would kill the step at this line under `-e`, so the diagnostic three
        # lines down — the one that names what is actually wrong — could never be reached.
        version=$( { grep -m1 '^rust-version' Cargo.toml || true; } | sed -E 's/^rust-version *= *"([^"]+)".*/\1/')
        if [ -z "$version" ]; then
          echo "Error: could not read rust-version from Cargo.toml"
          exit 1
        fi
        echo "Declared MSRV: $version"
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - name: Install Rust ${{ steps.msrv.outputs.version }}
      run: |
        rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal --no-self-update
        rustup default ${{ steps.msrv.outputs.version }}
    - name: cargo build --workspace --all-features
      run: cargo build --workspace --all-features

  # ── THE BYTE-IDENTITY GATE ──────────────────────────────────────────────────────────────────
  #
  # Recomputes the four corpus tree hashes (`benchmarks/tests/byte_identity.rs`) and fails if any
  # has moved. Before this job the four values lived in a GitHub issue and a commit message, so a
  # change that re-shaped every tree in the corpus went green through every gate in the repository.
  #
  # WHY HERE, and not in `macos.yml` or `miri.yml`. Those two exist to hold legs that are
  # queue-bound or slow, so that `CI` can reach a conclusion — see their headers. This gate is
  # neither: it is ten seconds of pure computation whose verdict is a property of the parser's
  # output, not of the host. Putting it behind the macOS queue would mean a moved hash surfaces
  # hours after the pull request that moved it, and a second OS row would buy no extra information
  # because the dump is byte-identical across platforms by construction (the escape is a fixed
  # `char::is_control` test, deliberately not a drifting Unicode table). One Linux job, on `CI`,
  # where a red is readable on the pull request that caused it.
  #
  # WHY `--release`. Not a preference. The `prefixes` corpus is ~9,300 documents and ~45 million
  # lines of dump; in an unoptimised build it does not finish inside ten minutes, while in release
  # all four corpora hash in about ten seconds. That is also why the test carries `#[ignore]` and
  # why `--include-ignored` is spelled out here: `cargo test` defaults to debug, so the expensive
  # corpus is opted into exactly once, in the one place that runs it in release. The three cheap
  # corpora are additionally covered by the ordinary `test` job above, which needs no opt-in.
  #
  # WHY `--test byte_identity` RATHER THAN A FILTER. A cargo target filter that matches nothing
  # warns and exits 0; a named `--test` target that has been renamed or deleted is a hard error.
  # This job must fail loudly if the gate stops existing, which is the failure mode that would
  # otherwise leave a green tick over no coverage at all.
  byte-identity:
    name: byte-identity
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install Rust
      run: rustup update stable --no-self-update && rustup default stable
    - name: Cache cargo build and registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-byte-identity-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-byte-identity-
    - name: cargo test --release --test byte_identity -- --include-ignored
      run: cargo test -p smear-apollo-bench --release --test byte_identity -- --include-ignored

  # ── THE VALIDATOR DIFFERENTIAL ORACLE ───────────────────────────────────────────────────────
  #
  # Runs smear's draft §5 validator against `apollo-compiler` 1.32.0 verdict by verdict
  # (`benchmarks/tests/validator_oracle.rs`, issue #85 G2). The committed corpus runs in the
  # ordinary `test` job too, because `cargo test --all-features` covers every workspace member —
  # this job exists for the two things that one cannot do.
  #
  # WHY A NAMED `--test` TARGET. Same reason as `byte-identity` above: a cargo target *filter* that
  # matches nothing warns and exits 0, so a renamed or deleted gate would leave a green tick over
  # no coverage. `--test validator_oracle` is a hard error if the target stops existing.
  #
  # WHY THE SECOND CHECKOUT. The committed corpus is self-contained on purpose — vendoring another
  # project's hundred and sixty fixtures is a licensing and drift liability — but it is not the
  # widest corpus available, and the difference is not academic. Perturbing draft 5.3.3 to
  # implement only one of its two directions left the committed corpus green at the time and
  # reddened three files in `apollo-rs`'s own `test_data`; the curated cases that now catch it were
  # written *because* this lane found the hole. `SMEAR_APOLLO_RS_TEST_DATA` is the door, and the
  # harness ingests the corpus by splitting each mixed file into its SDL and executable halves with
  # apollo's own AST parser, so both implementations read the same two texts.
  #
  # WHY A PINNED SHA AND NOT `main`. A moving external corpus in a required gate is a gate that
  # eventually gets switched off. `fa2b5fe8` is the `apollo-compiler@1.32.0` tag — the same release
  # `benchmarks/Cargo.toml` pins with `=`, so the corpus and the oracle move together or not at
  # all. Bumping one without the other is exactly the mistake the whitelist's re-verification test
  # exists to catch, and this pin makes it impossible to make by accident.
  #
  # WHY A TARBALL INTO `$RUNNER_TEMP` AND NOT `actions/checkout` WITH A `path:`. `path:` must stay
  # inside the workspace, which would put a foreign `Cargo.toml` tree inside this one's directory —
  # the situation the root manifest's `exclude = ["legacy"]` entry exists to work around, and not
  # one to reproduce for a directory nobody builds. `$RUNNER_TEMP` is outside the checkout, so
  # cargo never sees it and nothing needs excluding.
  validator-oracle:
    name: validator-oracle
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Fetch apollo-rs's validation corpus at the pinned oracle release
      run: |
        mkdir -p "$RUNNER_TEMP/apollo-rs"
        curl -sSfL https://github.com/apollographql/apollo-rs/archive/fa2b5fe840dd90d67b2ae2a6ed833a708eedb1ca.tar.gz \
          | tar -xz -C "$RUNNER_TEMP/apollo-rs" --strip-components=1
        # Fail here, loudly, rather than let the harness fall back to the committed corpus and
        # report a green run over a lane that fetched nothing.
        test -d "$RUNNER_TEMP/apollo-rs/crates/apollo-compiler/test_data/diagnostics"
    - name: Install Rust
      run: rustup update stable --no-self-update && rustup default stable
    - name: Cache cargo build and registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-validator-oracle-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-validator-oracle-
    - name: cargo test --test validator_oracle
      env:
        SMEAR_APOLLO_RS_TEST_DATA: ${{ runner.temp }}/apollo-rs/crates/apollo-compiler/test_data
      # `--nocapture` because the report is the artifact: how many cases reached a comparison, what
      # each whitelist class and each open gap accounted for. A green tick alone would not say
      # whether the oracle checked five hundred documents or five.
      run: cargo test -p smear-apollo-bench --test validator_oracle -- --nocapture

  # `needs:` is unchanged, but its effect is not. Every matrix named below used to contain a
  # `macos-latest` cell, so on a run where those cells never got a runner this job was never
  # created at all — it does not appear in the job list of #64's or #66's run. With the macOS
  # cells gone from those matrices it becomes reachable again, which means the first runs after
  # this change are the first time in a while that anything has watched `coverage` finish.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs:
      - rustfmt
      - clippy
      - build
      - cross
      - test
    steps:
      - uses: actions/checkout@v5
      - name: Install latest nightly
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true
      - uses: actions-rs/install@v0.1
        with:
          crate: cargo-tarpaulin
          version: latest
      - name: Cache ~/.cargo
        uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-coverage-dotcargo
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-coverage-cargo-build-target
      - name: Run tarpaulin
        uses: actions-rs/cargo@v1
        with:
          command: tarpaulin
          # `parser` is NOT optional here. With the crates merged it is a feature, and with it
          # off every parser test cfgs itself out while tarpaulin still exits 0 — the parser's
          # entire suite would vanish from coverage under a green tick. Before the merge the
          # parser was a crate and came in unconditionally; do not lean on the bench member's
          # dependency to force it back, which is unification and not a decision.
          args: --no-default-features --features graphql,parser --run-types tests --run-types doctests --workspace --out xml -- --quiet
      - name: Upload to codecov.io
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          fail_ci_if_error: true
