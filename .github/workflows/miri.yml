name: Miri

# ── THE SLOW LANE ───────────────────────────────────────────────────────────────────────────
#
# Miri lives in its own workflow so that `CI` can reach a CONCLUSION. Measured 2026-08-06 on the
# last five pull requests: `CI` concluded on exactly one of them. The four most recent — #60 and
# #63 (both MERGED anyway), #64 and #66 — were still `queued` hours later, while `loc` completed
# on the same refs in the same window, so it was never an outage.
#
# The jobs were not the problem; the RUN was. On #64's run (31051592352) 29 of 39 jobs completed
# and every one of them was green, but a conclusion is a property of the WHOLE run, so all 29 of
# those verdicts were unreadable. The 8 that never started were the 4 `macos-latest` legs of
# `rustfmt`/`clippy`/`build`/`test` and the 4 apple-darwin Miri cells; `coverage` never even got
# created, because it `needs:` matrices those macOS cells belong to. Nothing else was outstanding.
#
# WHY: the account's macOS runner concurrency is the binding constraint, and it is shared. At the
# time of measurement 96 macOS-bound jobs were queued or running in another repository's Miri
# workflow. smear's eight sat behind all of them.
#
# The one run that did conclude (30963710061, created 00:34:20Z) shows the cost with no queue
# theory needed: the last job to finish was `miri-tb-x86_64-apple-darwin` at 15:16:25Z — a
# 14h42m wall clock, of which the entire tail was macOS. `rustfmt (macos-latest)` in that run
# waited 6h38m to run for 9 seconds.
#
# WHY MIRI AND NOT ONLY THE APPLE CELLS. The 6 ubuntu Miri cells are not queue-bound, but they
# are the wall clock: in that same run `miri-tb-x86_64-apple-darwin` ran 4h20m and
# `miri-tb-aarch64-apple-darwin` 3h56m once started. Leaving any Miri cell in `CI` would keep
# `CI`'s answer hours away even with every runner free, so the whole gate moves and Miri reports
# on its own clock. The four ordinary macOS legs are queue-bound rather than slow, so they went
# to `.github/workflows/macos.yml` instead — a third lane, not this one, because a macOS
# formatting failure and a Miri UB report are different findings and should be readable apart.
#
# The SPLIT (#69/#71) was a scheduling change and not a coverage change: it moved the same 10
# cells, the same two aliasing models and the same `ci/miri_tb.sh` / `ci/miri_sb.sh` out of
# `.github/workflows/ci.yml` unchanged. The one step dropped in the move was
# `cargo install cargo-hack`, which neither script invokes: both run `cargo miri setup` and
# `cargo miri test` and nothing else, so it compiled a tool no cell used, on every cell.
#
# TWO THINGS ABOVE ARE NOW OUT OF DATE, and are kept because they are the measurement that
# justified the split rather than a description of the file. #77 changed both:
#
#   * "the macOS queue is a runner-concurrency constraint this repository does not own" — still
#     true of the account, still true of `.github/workflows/macos.yml`'s four legs, and true
#     again of two cells HERE. #77 took every cell in this file to `ubuntu-latest`; the benches
#     have since been consolidated back into `smear`, which put `criterion` back in its dev
#     graph, and the two `aarch64-apple-darwin` cells are on `macos-latest` again. The next
#     section says why, and why it is those two and no others. Six of the eight cells cost wall
#     clock alone; two cost the queue as well.
#   * "not a coverage change" — that was the split. #77 IS a coverage change, deliberately and
#     in one direction: the scripts now name their packages (`-p smear -p smear-lexer` since the
#     crate split), which drops the lossless CST tower.
#     See "WHAT THIS MATRIX DOES NOT COVER" below; it is not optional and it is not a saving.

# ── WHY ONE TARGET PICKS A macOS HOST AND THE OTHER THREE DO NOT ────────────────────────────
#
# Miri interprets a TARGET, so the host is supposed to be irrelevant, and for the three Linux
# targets below it is. `aarch64-apple-darwin` is the exception, and the reason has nothing to do
# with Miri: it is one C file, in one transitive dependency of the benchmark harness.
#
# `criterion 0.8.2` depends on `alloca 0.4.0`, whose build script is a `cc::Build` that compiles
# `alloca.c`. Cargo resolves dev-dependencies per PACKAGE and not per target, so the `--lib` TEST
# build these scripts make compiles `alloca` for whatever target was named; on a Linux host
# targeting `*-apple-darwin`, cc-rs invokes the host `cc` with `-arch arm64` and
# `-mmacosx-version-min=...`, which a Linux `cc` rejects. On a macOS host the same compile is
# native and the question never arises — which is why the pairing is written as a property of the
# target, in `runs-on:` below, rather than as a second matrix dimension.
#
# THIS FILE HAS SAID THE OPPOSITE, and what moved is where criterion lives — not what Miri does
# and not what a host can build. Before #77, `criterion` was `smear`'s dev-dependency and four
# apple cells were pinned to `macos-latest` by that C file. #77 moved the benches into their own
# workspace members, criterion left `smear`'s dev graph, and every cell went to `ubuntu-latest`;
# the measurement recorded then was `cargo miri test -p smear --tests --lib` resolving 32 packages
# where it had resolved 95. The benches have since been consolidated back into `smear` — six
# `[[bench]]` targets in the crate they measure, one `cargo bench`, and no fixture read across a
# member boundary — so criterion, the three comparison parsers and `apollo-parser` are in that
# graph again and the pin comes back with them. `smear/Cargo.toml`'s dev-dependency header
# carries what the consolidation cost and why it was taken.
#
# HOW MUCH BIGGER, measured on this tree as
# `cargo tree -p smear -e normal,dev,build --target <t>`, unique packages, before and after the
# consolidation (a resolve count, not the unit count the 32/95 figures above are — do not compare
# the two):
#
#   x86_64-unknown-linux-gnu       42 -> 143
#   i686-unknown-linux-gnu         42 -> 113   (no `apollo-compiler` subtree; see below)
#
# Every cell in this file pays that, because `--lib` in a TEST build links a package's whole
# dev-dependency set whether or not a test names one.
#
# IT COMES BACK FOR TWO CELLS, NOT FOUR, and that is the whole of the change. `x86_64-apple-darwin`
# was dropped for redundancy (next section), so the only apple target left is the one that is also
# the most valuable cell in the file. Two of eight cells now sit behind the account's macOS runner
# queue that this file's header measures; the other six do not.
#
# `apollo-compiler`, the differential oracle, is NOT in that graph on every target. It carries a
# const assertion that is false under the 32-bit x86 ABI, so `smear/Cargo.toml` declares it under
# `cfg(target_pointer_width = "64")` and the two `i686-unknown-linux-gnu` cells never resolve it.
# That is a real `[target.'cfg(...)']` predicate — one cargo evaluates against the target spec —
# and not a `cfg(miri)`, which appears nowhere in `rustc --print cfg` and would be always true.
#
# ── WHAT THE TARGET AXIS BUYS, AND WHY ONE CELL WAS DROPPED ─────────────────────────────────
#
# The previous revision of this comment said: "this workspace contains no `target_arch`,
# `target_os`, `target_vendor`, `target_pointer_width` or `target_endian` cfg anywhere, so every
# cell interprets the same source", and concluded that the two apple cells were the weakest of
# the five. The premise is true of this WORKSPACE and false of the PROGRAM Miri interprets, and
# with it the conclusion inverts.
#
# `memspan 0.1.0` is the SIMD substrate under the lexer — `smear/src/lexer/simd/*` and
# `string_lexer/*` call `memspan::skip::{skip_until, skip_digits, skip_ident}` on every lex — and
# it is where essentially all of the `unsafe` in the interpreted program lives: 302 sites, of
# which `needles/arch/aarch64.rs` has 49, `skip/neon.rs` 44, `skip/sse42.rs` 26, `skip/avx2.rs`
# 23, `skip/avx512.rs` 22, `needles/arch/x86.rs` 7 — and the scalar fallback has none. Those
# modules are `#[cfg(target_arch = ...)]`-partitioned, and WHICH of them runs is decided at
# runtime by `std::arch::is_aarch64_feature_detected!` / `is_x86_feature_detected!`, which Miri
# answers for itself. So the axis is real, and it is not the one the old paragraph named.
#
# Measured 2026-08-10, a standalone `cargo miri run` probe per target, printing exactly what
# `memspan::utils` asks:
#
#   aarch64-apple-darwin        neon = TRUE      -> NEON path interpreted (93 unsafe sites)
#   x86_64-apple-darwin         sse4.2 = false, avx2 = false  -> scalar fallback
#   x86_64-unknown-linux-gnu    sse4.2 = false, avx2 = false  -> scalar fallback
#   i686-unknown-linux-gnu      sse4.2 = false, avx2 = false  -> scalar fallback, 32-bit
#   powerpc64-unknown-linux-gnu  (no x86/aarch64 detection)   -> scalar fallback, big-endian
#
# `aarch64-apple-darwin` is therefore the ONLY cell in this matrix that interprets any of the
# project's SIMD `unsafe` at all. It is the strongest cell here, not the weakest, and it stays.
#
# `x86_64-apple-darwin` is the redundant one, and it is dropped. Against
# `x86_64-unknown-linux-gnu` it has the same `target_arch`, the same pointer width, the same byte
# order, the same aliasing model, and — measured above — the same feature-detection result, so it
# executes the same code. What is left between them is `target_os` / `target_vendor` /
# `target_env`, and neither `smear`, nor `memspan`, nor `tokora` contains a single cfg on any of
# the three; vendor is not something Miri models. Ten cells become eight.
#
# ONE GAP THIS LEAVES, recorded rather than assumed away: because Miri reports SSE4.2 and AVX2 as
# absent, `memspan`'s x86 SIMD modules — 71 of those 302 `unsafe` sites — are interpreted by no
# cell in this file. Recovering them means a `-C target-feature=+sse4.2` (or `+avx2`) x86 cell,
# which is an ADDITION and was not made here; this file's problem was that no cell could finish.

# ── WHAT THIS MATRIX DOES NOT COVER, AND WHY IT IS STATED HERE ──────────────────────────────
#
# Of the 50 integration targets in `smear/tests/`, 46 are NOT built with anything in them by any
# cell in this file, on any target, under either aliasing model, and 4 of the tests inside the
# ones that ARE built are skipped. All of it is derived and all of it is printed by
# `ci/miri_scope.py` at the end of every cell:
#
#   37  `#![cfg(feature = "rowan")]` — the entire lossless CST tower. `rowan` itself has
#       undefined behaviour reachable from its ordinary public API, live in every published
#       version including `0.17.0` (2026-08-02), reported upstream since 2021 and unfixed.
#       `ci/miri_sb.sh` and `ci/miri_tb.sh` carry the two sites, the reproduction and the
#       upstream references, and #77 carries the decision.
#    9  gated on `validator`, `proto` or `introspection` — features `smear` does not default to
#       and these scripts do not pass. They are `core` + `alloc` rule engines with no `unsafe`
#       reachable from them that the lib tests do not already interpret, so the cost of turning
#       the features on is minutes per cell for nothing Miri can answer.
#    4  individual tests, not targets: the two corpus sweeps in each of
#       `tests/syntactic_span_extent.rs` and `tests/syntactic_x_span_extent.rs`, each carrying
#       `#[cfg_attr(miri, ignore)]`. These are why this workflow had never produced a verdict on
#       any 64-bit target — `trivia_injection_leaves_every_span_on_its_own_tokens` spent 5h40m
#       inside itself on CI run 31318425279 and hit the six-hour job ceiling without returning.
#       The four witnesses in each file still run here. The files' headers carry the measurement.
#
# It is a per-test exclusion precisely so the interpretable tests survive it, and it is audited
# rather than counted on trust: `ci/miri_scope.py` derives the number of `#[ignore]`s from the
# sources and fails the cell if a run reports a different one, or if a target ends up with every
# test ignored — the case where the per-test form has quietly become the per-file one.
#
# THE NUMBER ABOVE IS PINNED, in both spellings. A derived count cannot catch a per-test ignore
# being ADDED: the source moves to five, the log moves to five, they agree, and a coverage cut has
# ratified itself. So `ci/miri_scope.py` also carries `MIRI_IGNORE_BUDGET` as a frozen literal,
# fails if the total moves in either direction, and fails if this file stops stating that same
# number — both at the count-list row above and in the sentence before it. Adding or removing a
# per-test ignore therefore takes three edits in one commit: the attribute, the budget, and this
# header. That is the decision being recorded, and the diff is the point.
#
# What is left in a cell is the lib unit tests, `tests/oracle.rs`,
# `tests/tokora_conformance.rs` and the eight span-extent witnesses — the SIMD lexer over a
# corpus, and tokora's own input-layer conformance kit. That is where this project's `unsafe`
# is, and it is what the job exists for.
#
# This is an exclusion, not a silence. `ci/miri_scope.py` derives every line above by parsing
# each target's crate-level `#![cfg(...)]` and evaluating it against the feature set it reads out
# of `smear/Cargo.toml`, prints the result with its reason, and FAILS the cell in either
# direction: if a target this cell DOES compile ran zero tests (#73's mechanism — a built,
# linked, passing, empty harness), or if an excluded one ran any test at all (#77's mechanism — a
# new workspace member unifying `smear/rowan` back into the resolve), or if the `ignored` count a
# target reports is not the one its source declares. The matrix is therefore allowed to be
# narrower than the test tree, and not allowed to be narrower than it says.

# `push`/`pull_request` triggers and `paths-ignore` are deliberately identical to
# `.github/workflows/ci.yml` and `.github/workflows/macos.yml`; read the comment there for why the
# ignore list carries no blanket `**.md`. `schedule` is the one deliberate difference — see below.
# `ci/check_workflow_triggers.sh` enforces that the `on.push.branches` lists stay identical across
# every workflow that has one, because that is the part where a divergence is silent.
on:
  push:
    # `main` is both the DEFAULT branch and the TRUNK; the separate trunk `feat/tokora-0.8` was
    # retired after `main` was fast-forwarded onto it. While they were different branches this lane
    # named only `main` and so never ran for a merge (#74). Any further entry is a live integration
    # branch, which takes merges too and so needs a lane for the same reason: today that is
    # `feat/proto`, temporary, dropped when the `proto` campaign lands on `main`. Kept identical to
    # `ci.yml`'s list, whose comment carries the full reasoning, the order a retired entry has to be
    # removed in, and the note on why a literal name is unavoidable in an `on:` block.
    branches:
      - main
      - feat/proto
    paths-ignore:
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - 'docs/**.md'
      - '**.txt'
  pull_request:
    paths-ignore:
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - 'docs/**.md'
      - '**.txt'
  workflow_dispatch:
  # NO `schedule`, deliberately, and this is the one place these triggers differ from `CI`'s.
  #
  # It carried `[cron: "0 1 */7 * *"]` until #74, where it was pure decoration: a `schedule` runs
  # only the DEFAULT branch's copy of a workflow, and this file does not exist on `main` at all,
  # so the line had never fired once. Removing it costs nothing that was happening.
  #
  # It is not restored on the retarget that would make it fire. This is the lane with both
  # problems the header describes — the macOS queue AND a 14h42m wall clock, 4h20m of it in a
  # single cell — and #73 is already about how much of that spend re-proves nothing. A weekly run
  # over unchanged source has strictly less to say than the push that produced the source: Miri
  # findings are a function of the code and of the toolchain, and the toolchain here is pinned by
  # `ci/miri_tb.sh` / `ci/miri_sb.sh`, not by the calendar. `push` and `pull_request` above cover
  # every change.

concurrency:
  # Same expression as `CI`'s and `macOS`'s, and `${{ github.workflow }}` leading it is what keeps
  # the three lanes independent: `CI-...`, `Miri-...` and `macOS-...` are different groups, so no
  # lane can cancel another's run. One in-flight run per ref, except for a push — which
  # `on.push.branches` above restricts to the integration branches — where the group is keyed on
  # the commit SHA so that every commit landing on one gets its own group and its own verdict. Do
  # NOT collapse that back to one group per ref: `cancel-in-progress: false` does not protect such
  # a run on its own, because a run queued into a group that already has one in progress cancels
  # whichever run was PENDING there regardless of that setting — and this workflow is precisely
  # the one whose runs stay pending long enough for the next push to do it.
  #
  # Keyed on the EVENT rather than on `github.ref == 'refs/heads/main'`, which is what it said
  # until #74; see `ci.yml`'s concurrency comment for why that literal was both wrong and the
  # thing that would have quietly halved this fix.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && github.sha || '' }}
  cancel-in-progress: ${{ !(github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}

# Every `run:` here is bash — the same block `ci.yml` and `macos.yml` carry, and `ci.yml`'s has
# the full account of what it is for. The construct at risk in this file is the
# `case ... esac` in both `Install cross C toolchain` steps, which PowerShell cannot parse at
# all. Before #86 it was safe only because that step's `if: runner.os == 'Linux'` skipped it on
# the apple cells — a guard written for a different purpose holding up a dialect assumption by
# accident. This block is what makes it safe for the stated reason instead, and the matrix has
# since proved the point twice: #77 made every host Linux, and the `runs-on:` expressions below
# have made one of them macOS again. "Every host happens to be Linux" is a property of the
# matrix, which changes in one line; declaring the shell is a property of the file.
defaults:
  run:
    shell: bash

# `RUSTFLAGS` is carried over from `CI` verbatim even though `ci/miri_tb.sh` and `ci/miri_sb.sh`
# both set `MIRIFLAGS` before any `cargo miri test`: neither script touches `RUSTFLAGS`, so this
# value is what `cargo miri setup` and the test build see, and changing it here would change what
# these cells compile. `CI`'s `nightly` / `stable` entries are not carried — no step in this
# workflow, or in that one, references them.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings -C debuginfo=0 -C codegen-units=16
  RUST_BACKTRACE: 1

jobs:
  miri-tb:
    name: miri-tb-${{ matrix.target }}
    strategy:
      # i686-unknown-linux-gnu and powerpc64-unknown-linux-gnu currently need
      # a cross toolchain (installed below); don't let a failure there
      # cancel the other, unrelated cells in this matrix.
      fail-fast: false
      matrix:
        # ONE dimension. Until #77 there was an `os` dimension too, with five `exclude:` entries
        # pairing each target to the only host that could build it — a 2 x 5 product carved back
        # down to 5. The pairing is real again, because `criterion` is back in `smear`'s dev
        # graph, but it is expressed in `runs-on:` below instead: the host is a CONSEQUENCE of
        # the target, and a second dimension would state four pairs where a target list plus one
        # rule states them once and cannot be half-edited.
        #
        # FOUR entries, not five: `x86_64-apple-darwin` was dropped because it is the one target
        # here that interprets the same program as another — same arch, width, endianness and
        # SIMD dispatch as `x86_64-unknown-linux-gnu`, differing only in a `target_os` /
        # `target_vendor` / `target_env` axis on which this dependency graph has no cfg at all.
        # The header carries the measurement. `aarch64-apple-darwin` is NOT redundant with it and
        # is the most valuable cell in the file: it is the only one that reaches `memspan`'s NEON
        # `unsafe`.
        target:
          - x86_64-unknown-linux-gnu
          - i686-unknown-linux-gnu
          - powerpc64-unknown-linux-gnu
          - aarch64-apple-darwin
    # `aarch64-apple-darwin` cannot be built from a Linux host — `criterion` -> `alloca` -> a C
    # build script; see the header. Every other target here builds on Linux and should stay
    # there, because the account's macOS runner concurrency is the queue this workflow's header
    # is about.
    runs-on: ${{ matrix.target == 'aarch64-apple-darwin' && 'macos-latest' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-miri-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-miri-
      - name: Install cross C toolchain for ${{ matrix.target }}
        # Named targets rather than a negation. The guard used to read
        # `runner.os == 'Linux' && matrix.target != 'x86_64-apple-darwin'`-shaped, which was
        # true for exactly the two targets the `case` below has branches for — but only by
        # coincidence, and a `runner.os` test is not the question being asked: `apt-get` is
        # wrong on the macOS cell AND on the x86_64 Linux one. Naming the two keeps the guard
        # and the `case` arms in agreement where a reader can see it, and makes adding a third
        # target a deliberate edit in two visible places rather than a silent fall-through to a
        # `case` with no matching branch.
        if: matrix.target == 'i686-unknown-linux-gnu' || matrix.target == 'powerpc64-unknown-linux-gnu'
        run: |
          case "${{ matrix.target }}" in
            i686-unknown-linux-gnu)
              sudo apt-get update
              sudo apt-get install -y gcc-multilib
              ;;
            powerpc64-unknown-linux-gnu)
              sudo apt-get update
              sudo apt-get install -y gcc-powerpc64-linux-gnu
              ;;
          esac
      - name: Miri
        run: |
          bash ci/miri_tb.sh ${{ matrix.target }}

  miri-sb:
    name: miri-sb-${{ matrix.target }}
    strategy:
      # i686-unknown-linux-gnu and powerpc64-unknown-linux-gnu currently need
      # a cross toolchain (installed below); don't let a failure there
      # cancel the other, unrelated cells in this matrix.
      fail-fast: false
      matrix:
        # ONE dimension. Until #77 there was an `os` dimension too, with five `exclude:` entries
        # pairing each target to the only host that could build it — a 2 x 5 product carved back
        # down to 5. The pairing is real again, because `criterion` is back in `smear`'s dev
        # graph, but it is expressed in `runs-on:` below instead: the host is a CONSEQUENCE of
        # the target, and a second dimension would state four pairs where a target list plus one
        # rule states them once and cannot be half-edited.
        #
        # FOUR entries, not five: `x86_64-apple-darwin` was dropped because it is the one target
        # here that interprets the same program as another — same arch, width, endianness and
        # SIMD dispatch as `x86_64-unknown-linux-gnu`, differing only in a `target_os` /
        # `target_vendor` / `target_env` axis on which this dependency graph has no cfg at all.
        # The header carries the measurement. `aarch64-apple-darwin` is NOT redundant with it and
        # is the most valuable cell in the file: it is the only one that reaches `memspan`'s NEON
        # `unsafe`.
        target:
          - x86_64-unknown-linux-gnu
          - i686-unknown-linux-gnu
          - powerpc64-unknown-linux-gnu
          - aarch64-apple-darwin
    # `aarch64-apple-darwin` cannot be built from a Linux host — `criterion` -> `alloca` -> a C
    # build script; see the header. Every other target here builds on Linux and should stay
    # there, because the account's macOS runner concurrency is the queue this workflow's header
    # is about.
    runs-on: ${{ matrix.target == 'aarch64-apple-darwin' && 'macos-latest' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-miri-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-miri-
      - name: Install cross C toolchain for ${{ matrix.target }}
        # Named targets rather than a negation. The guard used to read
        # `runner.os == 'Linux' && matrix.target != 'x86_64-apple-darwin'`-shaped, which was
        # true for exactly the two targets the `case` below has branches for — but only by
        # coincidence, and a `runner.os` test is not the question being asked: `apt-get` is
        # wrong on the macOS cell AND on the x86_64 Linux one. Naming the two keeps the guard
        # and the `case` arms in agreement where a reader can see it, and makes adding a third
        # target a deliberate edit in two visible places rather than a silent fall-through to a
        # `case` with no matching branch.
        if: matrix.target == 'i686-unknown-linux-gnu' || matrix.target == 'powerpc64-unknown-linux-gnu'
        run: |
          case "${{ matrix.target }}" in
            i686-unknown-linux-gnu)
              sudo apt-get update
              sudo apt-get install -y gcc-multilib
              ;;
            powerpc64-unknown-linux-gnu)
              sudo apt-get update
              sudo apt-get install -y gcc-powerpc64-linux-gnu
              ;;
          esac
      - name: Miri
        run: |
          bash ci/miri_sb.sh ${{ matrix.target }}
