name: perf

# ── THE MEASUREMENT LANE ────────────────────────────────────────────────────────────────────
#
# Three gates over one corpus: **peak allocation** and **instruction counts**, which are exact, and
# **wall clock**, which is coarse. `ci/perf/run.sh` carries the design — both sides built and
# measured in one run, no committed baseline — and `smear/benches/solo/perf/mod.rs` carries the
# workloads and why each declares two sizes. The counts run in a job of their own, `instruction
# counts (<image>)`, on two Linux images; its header below says why.
#
# A comparison needs no pull request. `gh workflow run perf.yml --ref <branch> -f base=<rev>` runs
# `perf-against` and the count job's two legs, each `ci/perf/run.sh --against <rev>`: that branch
# against the revision itself. Without `-f base`, a dispatch runs the self-comparisons,
# `perf-floor`'s and the count job's, as a push to `main` does.
#
# ── WHY A LANE OF ITS OWN AND NOT A JOB IN `CI` ─────────────────────────────────────────────
#
# Three reasons, in the order they decide it.
#
#   1. **It answers a different question, and a different question deserves a readable verdict.**
#      This is the argument `.github/workflows/macos.yml` and `.github/workflows/miri.yml` are
#      already built on: a macOS formatting failure and a Miri UB report are different findings and
#      should be readable apart. A performance delta is a third such finding — it is a
#      NEGOTIABLE one, licensed by a `Perf-accept:` trailer, where a `CI` red is not.
#   2. **It is advisory, and an advisory job inside `CI` is a lie in one direction or the other.**
#      `continue-on-error` inside `CI` produces a green run over a red job — which reads as "CI
#      passed" to everything that consumes a conclusion. Here the whole run is the advisory thing,
#      so `gh pr checks` shows a `perf` line that a reader can act on or not.
#   3. **It needs `fetch-depth: 0`**, because a merge-base cannot be computed from a shallow
#      checkout, and no other job in this repository does.
#
# ── ADVISORY FIRST, AND WHAT WOULD PROMOTE IT ───────────────────────────────────────────────
#
# Every gate is `continue-on-error: true` today. The criterion for making one required is stated
# so that promoting it is a decision somebody makes rather than a thing that never happens. The
# count gate's is per image and is in the `icount` job's header below; the other two are here:
#
#   * **The allocation gate** is promoted when the `perf-floor` job below has run `--self` on this
#     runner on **ten consecutive trunk pushes** and reported a difference of exactly zero on every
#     workload each time. The local measurement that justifies the threshold is exactly zero over
#     three invocations and one full self-comparison, so what the ten runs add is the runner and
#     the toolchain drift, not the arithmetic. It is the gate this repository actually needs, and
#     it should not stay advisory long.
#   * **The wall-clock gate** is promoted only if `perf-floor`'s worst self-comparison over the
#     same ten runs stays under **half** the configured threshold. If it does not, the honest
#     response is to widen the threshold or to retire the gate — not to re-run until it is green.
#     A gate whose failures are a coin flip trains people to ignore the one beside it.
#
# ── PYTHON >= 3.9 ───────────────────────────────────────────────────────────────────────────
#
# `ci/perf/compare.py`, `ci/perf/icount.py` and `ci/perf/exe_path.py` use nothing newer, which is
# deliberate: every Python gate in `ci/` except `ci/miri_scope.py` is 3.9-safe, so a local run on
# macOS's `/usr/bin/python3` works. GitHub's Ubuntu images ship far newer and no setup step is
# needed.

# `push`/`pull_request` triggers and `paths-ignore` are deliberately identical to
# `.github/workflows/ci.yml`, `windows.yml`, `macos.yml` and `miri.yml`; read the comment in
# `ci.yml` for why the ignore list carries no blanket `**.md`. `ci/check_workflow_triggers.sh`
# enforces that the `on.push.branches` lists stay identical across every workflow that has one,
# because that is the part where a divergence is silent.
on:
  push:
    # `main` is both the DEFAULT branch and the TRUNK. Any further entry is a live integration
    # branch, which takes merges too and so needs a lane for the same reason: the last one was
    # `feat/proto`, dropped once the `proto` campaign was rebase-merged into `main`. Kept identical
    # to `ci.yml`'s list, whose comment carries the full reasoning and the order a retired entry has
    # to be removed in.
    #
    # The push lane here is NOT a second copy of the pull-request gate — a merge-base comparison
    # against the branch you are already on is a comparison with nothing. It runs `--self`, which
    # is the calibration: the floor this runner produces for two builds of identical source. That
    # is the number the thresholds are supposed to be derived from, and deriving it once and
    # writing it down is how a threshold goes stale.
    branches:
      - main
    paths-ignore:
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - 'docs/**.md'
      - '**.txt'
  pull_request:
    paths-ignore:
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - 'docs/**.md'
      - '**.txt'
  workflow_dispatch:
    # Empty, a dispatch is the self-comparison it always was. Set, it is `perf-against`, and the
    # count job against the same revision.
    inputs:
      base:
        description: >-
          Compare the dispatched ref against this revision itself: a hash, a tag or a branch.
          Empty runs the self-comparison.
        required: false
        default: ''
        type: string
  # NO `schedule`. A gate that compares a branch against its own merge-base has nothing to say
  # about the passage of time: with no new commits there is no delta to measure, and `--self` on an
  # unchanged tree re-proves what the previous push already proved. `ci.yml`'s cron is the lane
  # that catches a new nightly or a yanked dependency; this one would spend two full builds a week
  # to print the same zeros.

concurrency:
  # Identical in shape to `CI`'s and `Miri`'s; see the comment in `ci.yml` for why
  # `${{ github.workflow }}` leads the group and why a push is keyed on the commit SHA. One
  # addition: a dispatch with `base` carries the base in its group, so dispatches of different
  # bases on one ref run side by side rather than the later cancelling the earlier, while a repeat
  # of the same base replaces the one before it. Without the input the suffix is empty, and a push
  # or a pull request gets the group it always got.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && github.sha || '' }}${{ inputs.base && format('-against-{0}', inputs.base) || '' }}
  cancel-in-progress: ${{ !(github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}

# Every `run:` here is bash — the same block every other workflow here carries, and `ci.yml`'s has
# the full account. Nothing in this file runs on a Windows host today, and the default is stated
# anyway so that adding such a job later cannot reintroduce the PowerShell parse failure #84 hit.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # `-Dwarnings` is deliberately NOT set here, and it is the one place this file departs from
  # `ci.yml`'s environment. The base side of every comparison compiles the MERGE-BASE's `src/`,
  # which is code this branch has already moved past: a warning that a later commit fixed — a new
  # rustc lint, a deprecation, an `unused` a refactor introduced — would fail the base build and
  # red this gate for a defect that no longer exists. `ci.yml` is where a warning is an error;
  # here it would only make the measurement unavailable.
  #
  # `-C debuginfo=0` is kept: it is what `ci.yml` builds under, it is identical on both sides, and
  # debug info is build time and disk rather than anything either instrument reads.
  RUSTFLAGS: -C debuginfo=0

jobs:
  # ── THE PULL-REQUEST GATE ─────────────────────────────────────────────────────────────────
  #
  # One build of each side serves both instruments, which is why they share a job rather than
  # getting one each: the build is the expensive half and running it twice to separate two tables
  # would double the lane's cost for a formatting preference. The counts are the exception, for
  # reasons the `icount` job below gives, and this job stays on x86 alone.
  perf:
    name: perf
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # ADVISORY. See the promotion criteria in this file's header — both of them are conditions on
    # `perf-floor`'s output, so they are checkable rather than a matter of opinion.
    continue-on-error: true
    steps:
    - uses: actions/checkout@v7
      with:
        # A merge-base cannot be computed from a shallow clone, and `actions/checkout` is shallow
        # by default. Without this the gate does not fail — it computes a merge-base of the wrong
        # commit and reports a delta over a range nobody asked about.
        fetch-depth: 0
    - name: Install Rust
      run: rustup update stable --no-self-update && rustup default stable
    - name: Cache cargo registry and both sides' target directories
      uses: actions/cache@v6
      with:
        # The two target directories are worth caching for the dependency graph alone —
        # criterion, apollo-compiler, the three comparison parsers, rowan twice — which cargo
        # fingerprints by package version, not by file times. That is the large half of every
        # build and it is what this restores. It does not spare the WORKSPACE MEMBERS, and must not:
        # `ci/perf/run.sh` extracts each side with `tar -m`, so every file is newer than anything
        # restored here and cargo compiles every member on both sides on every run. `git archive`
        # alone stamps a commit's files with the COMMIT's time, and a cache saved after that by a
        # build of another revision with the same manifests would then pass for this side's build;
        # the script also refuses a side whose own packages did not compile.
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ${{ runner.temp }}/smear-perf/target-head
          ${{ runner.temp }}/smear-perf/target-base
        key: ${{ runner.os }}-${{ runner.arch }}-perf-${{ hashFiles('**/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-perf-
    - name: ci/perf/run.sh ${{ github.base_ref }}
      # `origin/` prefixed, because `actions/checkout` leaves the base branch as a REMOTE ref: a
      # bare `feat/proto` does not resolve in the checkout and `git merge-base` would exit
      # non-zero rather than answering, which reads as a broken gate.
      run: ci/perf/run.sh "origin/${{ github.base_ref }}"

  # ── THE CALIBRATION ───────────────────────────────────────────────────────────────────────
  #
  # `--self` builds the identical source twice, in two directories, into two target directories,
  # and measures both. Whatever it reports IS this runner's floor, and every threshold in
  # `ci/perf/run.sh` is a claim about that number. Running it on the trunk rather than writing the
  # number down once is the whole point: a threshold derived on a developer's machine in August is
  # not a threshold about a GitHub runner in December.
  #
  # It is also the reproducibility check for the allocation instrument, in its stronger form. The
  # `perf` job above compares two READINGS of one binary; this one compares two independent BUILDS
  # of identical source, which is what would catch an address- or layout-dependent allocation size
  # that a repeated reading cannot see.
  perf-floor:
    name: perf-floor
    # A push, and a dispatch without `base`. A dispatch with `base` is `perf-against`'s, and the
    # count job's; the clause that says so tests the event first, so neither a push nor a pull
    # request reads it.
    if: >-
      github.event_name != 'pull_request'
      && !(github.event_name == 'workflow_dispatch' && inputs.base != '')
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Install Rust
      run: rustup update stable --no-self-update && rustup default stable
    - name: Cache cargo registry and both sides' target directories
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ${{ runner.temp }}/smear-perf/target-head
          ${{ runner.temp }}/smear-perf/target-base
        key: ${{ runner.os }}-${{ runner.arch }}-perf-${{ hashFiles('**/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-perf-
    - name: ci/perf/run.sh --self
      # More interleaved rounds than the pull-request gate, because this job's output is the
      # THRESHOLD DERIVATION and not a verdict: the wider the sample, the less the number it
      # publishes depends on which minute of the runner's life it ran in.
      env:
        PERF_ROUNDS: 6
      run: ci/perf/run.sh --self

  # ── A COMPARISON WITHOUT A PULL REQUEST ───────────────────────────────────────────────────
  #
  # A dispatch with `base`: the dispatched ref against that revision ITSELF, not against a
  # merge-base with it. The rest is the `perf` job's comparison — same steps, same rounds — for a
  # question no pull request asks. The input reaches the script through `env:` and a quoted
  # variable, never through the text of the command.
  perf-against:
    name: perf-against
    if: github.event_name == 'workflow_dispatch' && inputs.base != ''
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v7
      with:
        # All history, every branch (as `origin/<name>`) and every tag, so `base` can name any.
        fetch-depth: 0
    - name: Install Rust
      run: rustup update stable --no-self-update && rustup default stable
    - name: Cache cargo registry and both sides' target directories
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ${{ runner.temp }}/smear-perf/target-head
          ${{ runner.temp }}/smear-perf/target-base
        key: ${{ runner.os }}-${{ runner.arch }}-perf-${{ hashFiles('**/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-perf-
    - name: ci/perf/run.sh --against "$PERF_BASE"
      env:
        PERF_BASE: ${{ inputs.base }}
      run: ci/perf/run.sh --against "$PERF_BASE"

  # ── INSTRUCTION COUNTS, ON TWO LINUX IMAGES ───────────────────────────────────────────────
  #
  # `ci/perf/run.sh`'s count stage, run alone: `PERF_ONLY=icount`, through the script's own path —
  # the two trees, the instrument laid over the merge-base, the pinned profile, one lock, every
  # refusal the other gates get — and then `wall_clock`'s count mode under callgrind on both sides.
  # The script's header carries what a count reads and every way it refuses; this says why it is a
  # job of its own and what would make it required.
  #
  # A JOB OF ITS OWN, at the cost of a second build of both sides: its verdict is the count's alone,
  # readable apart from the other two gates, and its time does not land on theirs. And it runs on
  # two architectures where they run on one. A count is a property of the binary, so the ARM leg is
  # a second exact reading of every change, compiled by another backend, where an ARM clock would
  # only be a second noisy one; `perf` keeps allocation and wall clock on x86 alone.
  #
  # ONE UBUNTU RELEASE ON BOTH LEGS, named rather than `-latest`, so the two differ in architecture
  # and in nothing the image chooses, such as glibc and valgrind's release. Each table names the
  # image, valgrind's version and the CPU model, because an absolute count is a property of all
  # three; a difference read on one runner in one run is a property of none of them.
  #
  # EVERY TRIGGER, mirroring the three jobs above: a pull request against its merge-base, a push to
  # the trunk or a dispatch without `base` as the self-comparison, a dispatch with `base` as
  # `--against`. On the trunk `--self` is the determinism check, and the only one the ARM leg has:
  # no smear binary had run under valgrind on ARM before this job.
  #
  # ── ADVISORY, AND WHAT WOULD PROMOTE IT ─────────────────────────────────────────────────────
  #
  # `continue-on-error: true`, like every job in this file. Making a leg required is the owner's
  # decision, per image, when both of these hold for that image:
  #
  #   1. this job's `--self` on the trunk has read +0.000% on every workload at both sizes, with no
  #      workload NOT MEASURED, on ten consecutive trunk pushes; and
  #   2. a drift sample exists: merged commits replayed against their parents with dispatches of
  #      this workflow (`gh workflow run perf.yml --ref <commit's branch> -f base=<its parent>`),
  #      whose largest movement on a workload the commit's source did not touch stays under the +1%
  #      line. x86 has the lexer-dispatch campaign's sample, whose largest step was 0.92%; ARM has
  #      none, and its table says so.
  #
  # The first is the property the threshold assumes, shown on the runner rather than argued. The
  # second is the property it rests on, and the first cannot show it: one source gives one binary,
  # so a self-comparison of counts reads zero by construction.
  icount:
    name: instruction counts (${{ matrix.image }})
    strategy:
      # Each leg is its own reading. Under the default a red leg would cancel the other, which
      # `gh pr checks` then shows as a failure of its own.
      fail-fast: false
      matrix:
        image:
          - ubuntu-26.04
          - ubuntu-26.04-arm
    runs-on: ${{ matrix.image }}
    continue-on-error: true
    # Two builds and the count stage. Each callgrind run has its own bound in `run.sh`,
    # `PERF_ICOUNT_TIMEOUT`, so a run that hangs costs its row and not the job; this is for the rest.
    timeout-minutes: 60
    env:
      PERF_ONLY: icount
      # Named in each table's heading.
      PERF_RUNNER_IMAGE: ${{ matrix.image }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    # The half of the gate that decides, over synthetic readings, and `icount.py`'s reader of
    # callgrind's files, over lines real runs wrote, before anything is built: a comparator that
    # passed everything would leave this job green with the gate off, and a reader stricter than
    # callgrind leaves every row NOT MEASURED.
    - name: compare.py and the callgrind reader, self-test before anything is built
      run: bash ci/perf/compare_selftest.sh
    - name: Install Rust
      run: rustup update stable --no-self-update && rustup default stable
    - name: Install valgrind
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends valgrind
        valgrind --version
    - name: Cache cargo registry and both sides' target directories
      uses: actions/cache@v6
      with:
        # As in `perf`, and keyed by the image as well as the architecture: each leg restores only
        # what a build on its own image saved, never an entry `perf` saved on `ubuntu-latest`.
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ${{ runner.temp }}/smear-perf/target-head
          ${{ runner.temp }}/smear-perf/target-base
        key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.image }}-perf-${{ hashFiles('**/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-${{ matrix.image }}-perf-
    - name: ci/perf/run.sh ${{ github.base_ref }}, counts only
      if: github.event_name == 'pull_request'
      run: ci/perf/run.sh "origin/${{ github.base_ref }}"
    - name: ci/perf/run.sh --self, counts only
      if: >-
        github.event_name != 'pull_request'
        && !(github.event_name == 'workflow_dispatch' && inputs.base != '')
      run: ci/perf/run.sh --self
    - name: ci/perf/run.sh --against "$PERF_BASE", counts only
      if: github.event_name == 'workflow_dispatch' && inputs.base != ''
      env:
        PERF_BASE: ${{ inputs.base }}
      run: ci/perf/run.sh --against "$PERF_BASE"
    - name: Keep both sides' readings
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        # One name per leg: a second artifact of one name in one run fails the upload.
        name: icount-readings-${{ matrix.image }}
        path: ${{ runner.temp }}/smear-perf/icount/*.json
        if-no-files-found: warn
