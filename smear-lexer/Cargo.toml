[package]
name = "smear-lexer"
version.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
readme = "README.md"
description = "Blazing fast lexer for GraphQL and GraphQL-like DSLs"

[features]
default = ["std", "graphql", "graphqlx", "smallvec"]
alloc = []
std = ["thiserror/default", "bytes?/default", "bstr?/default", "hipstr?/default"]

unstable = []

graphql = []
graphqlx = ["unstable"]
smallvec = ["dep:smallvec"]

bytes = ["dep:bytes", "tokit/bytes_1"]
bstr = ["dep:bstr", "tokit/bstr_1"]
hipstr = ["dep:hipstr", "tokit/hipstr_0_8"]

[dependencies]
derive_more.workspace = true
paste = "1"
thiserror.workspace = true
tokit.workspace = true

# SIMD primitives (skip_ident, skip_class!) for the experimental
# `syntactic_simd` layer. Path dep for now while we iterate; can move to a
# crates.io version once lexsimd is published.
lexsimd = { path = "../../lexsimd", default-features = false, features = ["std"] }

hipstr = { version = "0.8", default-features = false, optional = true }
bytes = { workspace = true, optional = true }
bstr = { workspace = true, optional = true }
smallvec = { version = "1", default-features = false, features = ["const_new"], optional = true }

[dev-dependencies]
criterion = "0.8"

# Disable the default libtest bench harness; all benches go through criterion.
[lib]
bench = false

[[bench]]
path = "benches/lex_baseline.rs"
name = "lex_baseline"
harness = false

[lints.rust]
rust_2018_idioms = "warn"
single_use_lifetimes = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(all_tests)',
  'cfg(tarpaulin)',
  # Testing / coverage helpers. These are set via `RUSTFLAGS='--cfg ...'`
  # in CI to force the dispatcher down a specific path so lower‑tier
  # kernels and the scalar fallback get coverage on runners that would
  # otherwise always pick the top tier.
  'cfg(smear_lexer_force_scalar)',
  'cfg(smear_lexer_disable_avx512)',
  'cfg(smear_lexer_disable_avx2)',
] }
