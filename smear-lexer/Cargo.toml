[package]
name = "smear-lexer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
description = "Zero-copy lexers for GraphQL and GraphQLx: a syntactic token stream that skips trivia and a lossless one that keeps every byte of it."
keywords = ["graphql", "lexer", "tokenizer", "zero-copy", "no-std"]
categories = ["parsing", "parser-implementations", "no-std"]

# A real file, not a symlink: this crate has its own README and there is nothing for it to drift
# from. `smear/README.md` is a symlink because that one IS the workspace-root landing page.
readme = "README.md"

# The irreducible base of the stack, and the crate this split restores. #84 merged it into `smear`
# behind a `parser` feature; the full-stack target reverses that, because a syntax highlighter, a
# formatter front end or a token-level tool has no reason to resolve the parser tower, let alone
# the schema and the protocol machine, to read tokens.
#
# There is deliberately NO `lexer` feature here and none in the umbrella: the lexer is what this
# crate IS, and a gate that can only ever be on is not a gate.

[features]
# Element-for-element the subset of `smear`'s own default that reaches this layer: `std`, both
# dialects, and `smallvec`. `smear` names every member feature explicitly with
# `default-features = false`, so this list governs a DIRECT dependent and nothing else.
default = ["std", "graphql", "graphqlx", "smallvec_1"]
alloc = ["tokora/alloc", "memspan/alloc", "bstr_1?/alloc", "smol-bytes_0_2?/alloc"]
std = [
  "tokora/std",
  "memspan/std",
  "thiserror/std",
  "bytes_1?/std",
  "bstr_1?/std",
  "hipstr_0_8?/std",
  "smol-bytes_0_2?/std",
]

# The two dialects. Each is a module only in a build that enables it, which is why every doc link
# to one is `#[cfg_attr]`-gated: ungated they are `unresolved link` errors under
# `RUSTDOCFLAGS="-D warnings"` in a single-dialect build.
graphql = []
graphqlx = []

# The source-representation integrations. Each turns on the matching `tokora` backing so the
# lexer's `Source` implementations line up with the substrate's; enabling the dependency alone
# would compile the type in and leave the substrate half missing.
#
# The versioned feature is the switch, named for the major of the crate it enables, and the
# dependency key carries the same version, so the crate is `bytes_1` in code. The unversioned name
# is a pure alias for the current major and carries nothing else.
#
# None implies a tier, and `std` and `alloc` above reach the dependencies weakly, with `?/`, so a
# tier never turns one on either. All but `bstr_1` link `alloc` whatever the tier, `smol-bytes_0_2`
# through tokora's own edge to it, and every item that names one is gated on `std` or `alloc` too.
smallvec = ["smallvec_1"]
smallvec_1 = ["dep:smallvec_1"]
bytes = ["bytes_1"]
bytes_1 = ["dep:bytes_1", "tokora/bytes_1"]
bstr = ["bstr_1"]
bstr_1 = ["dep:bstr_1", "tokora/bstr_1"]
hipstr = ["hipstr_0_8"]
hipstr_0_8 = ["dep:hipstr_0_8", "tokora/hipstr_0_8"]
smol-bytes = ["smol-bytes_0_2"]
smol-bytes_0_2 = ["dep:smol-bytes_0_2", "tokora/smol-bytes_0_2"]

[dependencies]
derive_more.workspace = true
paste = "1"
thiserror.workspace = true
tokora.workspace = true

# 0.1.3 is the first memspan release with `skip_until_or_non_ascii`.
memspan = { version = "0.1.3", default-features = false }

hipstr_0_8 = { package = "hipstr", version = "0.8", default-features = false, optional = true }
bytes_1 = { workspace = true, optional = true }
smol-bytes_0_2 = { workspace = true, optional = true }
bstr_1 = { workspace = true, optional = true }
smallvec_1 = { package = "smallvec", version = "1", default-features = false, features = ["const_new"], optional = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
